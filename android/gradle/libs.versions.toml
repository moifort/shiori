firebaseBom = "35.2.0"
googleServices = "4.6.0"
credentials = "1.6.0"
googleid = "1.2.1"
billing = "9.1.0"
sentry = "8.64.0"
camerax = "1.6.2"
window = "1.5.1"
datastore = "1.3.0"
browser = "1.10.0"
