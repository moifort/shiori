# Sharing a library with somebody.
#
# Friendship is symmetric: accepting an invitation opens both libraries at once,
# and either of the two can end it for both. A friend's books come back as their
# own type, which carries no reading note at all.

query Friends {
  friends {
    ...FriendRow
  }
}

fragment FriendRow on Friend {
  userId
  firstName
  since
  bookCount
  favoriteCount
  readingCount
  toReadCount
  readThisYear
  recentActivity {
    kind
    at
    bookId
    title
    format
    coverUrl
  }
}

# What every friend hearted in the last thirty days, sagas and books mixed,
# the newest first: the dashboard's news from the people the reader shares with.
query FriendFavorites {
  friendFavorites {
    friendId
    friendName
    favoritedAt
    book {
      ...FriendBookRow
    }
    saga {
      ...FriendSagaRow
    }
  }
}

query FriendProfile($userId: UserId!) {
  friendProfile(userId: $userId) {
    ...SharedShelf
  }
}

# The reader's own shelf, exactly as their friends see it.
query MyShelf {
  myShelf {
    ...SharedShelf
  }
}

fragment SharedShelf on FriendProfile {
  userId
  firstName
  reading {
    ...FriendBookRow
  }
  pile {
    ...FriendBookRow
  }
  favorites {
    ...FriendBookRow
  }
  lastFinished {
    ...FriendBookRow
  }
  lastDropped {
    ...FriendBookRow
  }
  lastAdded {
    ...FriendBookRow
  }
  bookCount
  readThisYear
  sagas {
    ...FriendSagaRow
  }
}

fragment FriendSagaRow on FriendSaga {
  id
  seriesId
  name
  audio
  author
  language
  ownedCount
  favorite
  favoritedAt
  rating
  genre
  subgenre
  shelvedAt
  state
  volumes {
    ...FriendBookRow
  }
}

# A friend's whole library, a page at a time, drawn as the reader's own.
query FriendLibraryPage($userId: UserId!, $status: ReadingStatus, $after: BookId) {
  friendLibraryPage(userId: $userId, status: $status, limit: 60, after: $after) {
    books {
      ...FriendBookRow
    }
    hasMore
  }
}

# A friend's sagas, a page at a time, each with every volume as a cover.
query FriendSagaPage($userId: UserId!, $state: SeriesState, $loved: Boolean, $after: String) {
  friendSagaPage(userId: $userId, state: $state, loved: $loved, limit: 30, after: $after) {
    sagas {
      ...FriendSagaRow
    }
    hasMore
  }
}

# A saga opened from a friend's shelf: the shared catalogue, with where the
# friend stands on it — their volumes, their stars and their heart — in place of
# the reader's own.
query FriendSeriesScreen($userId: UserId!, $id: SeriesId!, $language: BookLanguage) {
  series(id: $id, language: $language) {
    ...SeriesCatalogue
  }
  friendSaga(userId: $userId, seriesId: $id, language: $language) {
    ...FriendSagaRow
  }
}

fragment FriendBookRow on FriendBook {
  id
  title
  authors
  format
  language
  coverUrl
  status
  rating
  favorite
  favoritedAt
  lastActivityAt
  shelvedAt
  finishedAt
  addedAt
  startedAt
  inLibrary
  genre
  subgenres
  series {
    id
    name
    volume
    kind
  }
}

mutation InviteFriend {
  inviteFriend {
    code
    expiresAt
  }
}

mutation AcceptFriendInvitation($code: String!) {
  acceptFriendInvitation(code: $code) {
    ...FriendRow
  }
}

mutation RemoveFriend($userId: UserId!) {
  removeFriend(userId: $userId)
}

# One book of a friend's shelf, for the read-only page a row opens.
# Whether a friend's book can be taken as an audiobook: Audible is asked for
# a printed one, so the page asks only when it opens.
query FriendBookAudio($userId: UserId!, $bookId: BookId!) {
  friendBookAudio(userId: $userId, bookId: $bookId)
}

query FriendBook($userId: UserId!, $bookId: BookId!) {
  friendBook(userId: $userId, bookId: $bookId) {
    ...FriendBookRow
    publisher
    firstPublishedIn
    synopsis
    pageCount
    durationMinutes
    narrators
    isbn13
    audibleUrl
    listeningProgress
    addedAt
    startedAt
  }
}

# Copy a friend's book onto the reader's shelf, in the format the reader takes
# it in. The server re-reads it and records the friend as the recommender.
mutation AddFriendBook(
  $userId: UserId!
  $bookId: BookId!
  $status: CopiedStatus!
  $format: BookFormat
) {
  addFriendBook(userId: $userId, bookId: $bookId, status: $status, format: $format) {
    id
  }
}
