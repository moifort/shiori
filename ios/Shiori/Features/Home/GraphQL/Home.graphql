# The home dashboard: reading statistics and the shelves worth a glance, counted
# in the device time zone.
query Dashboard($timeZone: TimeZone!) {
  dashboard(timeZone: $timeZone) {
    currentYear
    booksPerYear {
      year
      count
    }
    pagesPerMonth {
      month
      pages
    }
    hoursPerMonth {
      month
      hours
    }
    reading {
      ...DashboardBookCard
    }
    suggestions {
      ...DashboardBookCard
    }
    lastFinished {
      ...DashboardBookCard
    }
    booksRead {
      current
      previous
    }
    daysToFinish {
      current
      previous
    }
    toReadCount
    readCount
    monthsToClearPile
    averageRating
    ratedCount
    genres {
      genre
      count
    }
    series {
      id
      name
      readCount
      totalCount
      rating
      favorite
    }
    favoriteCount
    droppedCount
    hasAudiobooks
    hasPrintedBooks
    libraryIsEmpty
  }
}

fragment DashboardBookCard on DashboardBook {
  id
  title
  authors
  coverUrl
  rating
  listeningProgress
  startedAt
  finishedAt
}
