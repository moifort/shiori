# The home dashboard: reading statistics and the shelves worth a glance, counted
# in the device time zone.
query Dashboard($timeZone: TimeZone!) {
  dashboard(timeZone: $timeZone) {
    currentYear
    booksPerYear {
      year
      count
    }
    pagesPerMonth {
      month
      pages
    }
    hoursPerMonth {
      month
      hours
    }
    reading {
      ...DashboardBookCard
    }
    lastFinished {
      ...DashboardBookCard
    }
    booksRead {
      current
      previous
    }
    toReadCount
    readCount
    monthsToClearPile
    averageRating
    ratedCount
    genres {
      genre
      count
    }
    series {
      id
      name
      audio
      readCount
      totalCount
      rating
      favorite
    }
    favoriteCount
    droppedCount
    hasAudiobooks
    hasPrintedBooks
    libraryIsEmpty
  }
}

fragment DashboardBookCard on DashboardBook {
  id
  title
  authors
  format
  coverUrl
  rating
  listeningProgress
  startedAt
  finishedAt
}

# What the reader's genres say about their tastes: the page the genre card opens.
query GenreInsights {
  genreInsights {
    readCount
    shares {
      genre
      count
    }
    formats {
      format
      count
      topGenre
    }
    tastes {
      genre
      readCount
      averageRating
    }
    averageRating
    hiddenGem
    longest {
      genre
      averagePages
    }
    fastest {
      genre
      averageDays
    }
    mostDropped {
      genre
      droppedCount
      startedCount
    }
    unexplored {
      genre
      pileCount
    }
  }
}
