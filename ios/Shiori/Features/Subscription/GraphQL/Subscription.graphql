# The plan and the scan allowance together, for the subscription sheet: one
# request draws the whole of it.
query SubscriptionState {
  entitlement {
    ...EntitlementFields
  }
  quota {
    ...QuotaFields
  }
}

# The allowance alone, re-read once a purchase or a restore made the account
# Premium. Nothing re-reads it after a scan: the only screen that draws the
# counter is the subscription sheet, which reads it afresh on opening.
query Quota {
  quota {
    ...QuotaFields
  }
}

fragment EntitlementFields on Entitlement {
  plan
  productId
  expiresOn
  appAccountToken
}

# The scan allowance. `totalRemaining` is what the app gates on: it folds the
# month's allowance and the welcome credits into the one number that answers
# "can I scan right now".
fragment QuotaFields on Quota {
  plan
  limit
  used
  remaining
  welcomeRemaining
  totalRemaining
  renewsOn
}

# Hands App Store's signed transaction to the server, which verifies it against
# Apple's root certificates before granting anything.
mutation SyncEntitlement($signedTransaction: String!) {
  syncEntitlement(signedTransaction: $signedTransaction) {
    ...EntitlementFields
  }
}
