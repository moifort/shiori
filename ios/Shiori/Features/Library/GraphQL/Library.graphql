# The library list: every book the reader owns, grouped into series sections.
# `status` narrows it to one shelf of the pile; omitting it returns everything.
query Library($status: ReadingStatus) {
  library(status: $status) {
    ...LibrarySectionRow
  }
}

# One page of the Library tab, for the list that draws as it scrolls: a flat
# list the server has already ordered, which the app cuts into sections wherever
# the status (or, arranged by genre, the genre) changes. The last book of a page
# is the cursor for the next.
query LibraryPage(
  $arrangement: LibraryArrangement
  $favorite: Boolean
  $status: ReadingStatus
  $limit: Int
  $after: BookId
) {
  libraryPage(
    arrangement: $arrangement
    favorite: $favorite
    status: $status
    limit: $limit
    after: $after
  ) {
    hasMore
    books {
      ...BookSummary
    }
  }
}

fragment LibrarySectionRow on LibrarySection {
  seriesId
  series
  language
  opinion {
    rating
    favorite
  }
  books {
    ...BookSummary
  }
}

# What a row needs, and nothing more: the detail screen asks for the rest. A
# library of 300 books pays for every field listed here, 300 times over.
fragment BookSummary on Book {
  id
  title
  authors
  format
  genre
  subgenres
  language
  coverUrl
  status
  rating
  favorite
  series {
    id
    name
    volume
    kind
  }
}
