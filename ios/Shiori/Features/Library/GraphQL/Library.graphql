# The library list: every book the reader owns, grouped into series sections.
# `status` narrows it to one shelf of the pile; omitting it returns everything.
query Library($status: ReadingStatus) {
  library(status: $status) {
    ...LibrarySectionRow
  }
}

# One page of the same list, for the tab that draws as it scrolls: the last
# book of a page is the cursor for the next, and a saga cut across two pages
# comes back under the same heading on both.
query LibraryPage($status: ReadingStatus, $limit: Int, $after: BookId) {
  libraryPage(status: $status, limit: $limit, after: $after) {
    hasMore
    sections {
      ...LibrarySectionRow
    }
  }
}

fragment LibrarySectionRow on LibrarySection {
  seriesId
  series
  language
  opinion {
    rating
    favorite
  }
  books {
    ...BookSummary
  }
}

# What a row needs, and nothing more: the detail screen asks for the rest. A
# library of 300 books pays for every field listed here, 300 times over.
fragment BookSummary on Book {
  id
  title
  authors
  format
  genre
  subgenres
  language
  coverUrl
  status
  rating
  favorite
  series {
    id
    name
    volume
    kind
  }
}
