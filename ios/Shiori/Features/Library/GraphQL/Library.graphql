# One page of the Library tab, for the list that draws as it scrolls: a flat
# list the server has already ordered, newest first, which the app cuts into
# month sections wherever the month of `shelvedAt` changes. The last book of a
# page is the cursor for the next.
# `rated` is the "Notés" view: the books that show stars, best first, which the
# app cuts into sections by stars rather than by month.
query LibraryPage($favorite: Boolean, $status: ReadingStatus, $limit: Int, $after: BookId) {
  libraryPage(favorite: $favorite, status: $status, limit: $limit, after: $after) {
    hasMore
    books {
      ...BookSummary
    }
  }
}

# What a row needs, and nothing more: the detail screen asks for the rest. A
# library of 300 books pays for every field listed here, 300 times over.
fragment BookSummary on Book {
  id
  title
  authors
  format
  genre
  subgenres
  language
  coverUrl
  status
  listeningProgress
  rating
  seriesRating
  favorite
  shelvedAt
  series {
    id
    name
    volume
    kind
  }
}
