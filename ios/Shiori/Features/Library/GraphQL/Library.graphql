# One page of the Library tab, for the list that draws as it scrolls: a flat
# list the server has already ordered, newest first, which the app cuts into
# month sections wherever the month of `shelvedAt` changes. The last book of a
# page is the cursor for the next.
# `loved` is the favourites view: the books judged, hearts first then stars,
# which the app cuts into sections by rank rather than by month. `favorite` is
# the "Favoris" filter: the hearted books alone, by date.
# `format`, `genre` and `subgenre` are the pills over a shelf and the genre
# page it was opened from.
query LibraryPage(
  $favorite: Boolean
  $loved: Boolean
  $status: ReadingStatus
  $format: BookFormat
  $genre: Genre
  $subgenre: Subgenre
  $limit: Int
  $after: BookId
) {
  libraryPage(
    favorite: $favorite
    loved: $loved
    status: $status
    format: $format
    genre: $genre
    subgenre: $subgenre
    limit: $limit
    after: $after
  ) {
    hasMore
    books {
      ...BookSummary
    }
  }
}

# What a row needs, and nothing more: the detail screen asks for the rest. A
# library of 300 books pays for every field listed here, 300 times over.
fragment BookSummary on Book {
  id
  title
  authors
  # What a long press opens the author's page with.
  authorKeys
  format
  media
  genre
  subgenres
  language
  coverUrl
  status
  listeningProgress
  rating
  seriesRating
  favorite
  shelvedAt
  # How long a book given up on has been set down.
  statusChangedAt
  series {
    id
    name
    volume
    kind
  }
}

# The Library tab's entry screen, in one request and one scan of the library:
# the format pills, the rails of books, the genre tiles, and the series and
# authors rails. Under a genre page, its subgenre pills too.
query LibraryShelves($format: BookFormat, $genre: Genre, $subgenre: Subgenre) {
  libraryShelves(format: $format, genre: $genre, subgenre: $subgenre) {
    formats
    recent {
      ...BookSummary
    }
    toRead {
      ...BookSummary
    }
    readRecently {
      ...BookSummary
    }
    favorites {
      ...BookSummary
    }
    hasDropped
    genres {
      genre
      count
      cover {
        id
        coverUrl
      }
    }
    subgenres
    series {
      ...FollowedSeriesRow
      volumes {
        ...FollowedVolume
      }
      catalogue {
        ...CatalogueSpine
      }
    }
    authors {
      key
      name
      indexLetter
      portraitUrl
      favorite
      bookCount
      seriesCount
      favoriteCount
      averageRating
      shelvedAt
    }
  }
}
