query Book($id: BookId!) {
  book(id: $id) {
    ...BookDetail
  }
}

mutation AddBook($input: NewBookInput!) {
  addBook(input: $input) {
    ...BookDetail
  }
}

mutation UpdateBook($id: BookId!, $input: BookEditInput!) {
  updateBook(id: $id, input: $input) {
    ...BookDetail
  }
}

mutation SetReadingStatus($id: BookId!, $status: ReadingStatus!) {
  setReadingStatus(id: $id, status: $status) {
    ...BookDetail
  }
}

mutation RateBook($id: BookId!, $rating: StarRating!) {
  rateBook(id: $id, rating: $rating) {
    ...BookDetail
  }
}

mutation RemoveBookRating($id: BookId!) {
  removeBookRating(id: $id) {
    ...BookDetail
  }
}

mutation SetBookHidden($id: BookId!, $hidden: Boolean!) {
  setBookHidden(id: $id, hidden: $hidden) {
    ...BookDetail
  }
}

mutation SetBookFavorite($id: BookId!, $favorite: Boolean!) {
  setBookFavorite(id: $id, favorite: $favorite) {
    ...BookDetail
  }
}

mutation DeleteBook($id: BookId!) {
  deleteBook(id: $id)
}

fragment BookDetail on Book {
  id
  title
  authors
  format
  publisher
  firstPublishedIn
  synopsis
  genre
  subgenres
  pageCount
  durationMinutes
  listeningProgress
  narrators
  language
  isbn13
  coverUrl
  status
  rating
  seriesRating
  favorite
  note
  hidden
  addedAt
  startedAt
  finishedAt
  series {
    id
    name
    volume
    kind
  }
}

# The reader's own subgenre vocabulary, most used first: what the edit form
# proposes as they type. Costs the server the same scan as the library.
query Subgenres {
  subgenres
}
