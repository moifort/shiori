query Book($id: BookId!) {
  book(id: $id) {
    ...BookDetail
  }
}

mutation AddBook($input: NewBookInput!) {
  addBook(input: $input) {
    ...BookDetail
  }
}

mutation UpdateBook($id: BookId!, $input: BookEditInput!) {
  updateBook(id: $id, input: $input) {
    ...BookDetail
  }
}

# The edit sheet, saved in one request: the correction and the stars ride one
# document, which the server runs field by field in order, and only what the
# reader changed is sent. `rating` defaults so a sheet that clears or keeps the
# stars need not invent a value for a field it skips.
mutation SaveBook(
  $id: BookId!
  $input: BookEditInput!
  $correct: Boolean!
  $rating: StarRating = 5
  $rate: Boolean!
  $unrate: Boolean!
) {
  updateBook(id: $id, input: $input) @include(if: $correct) {
    ...BookDetail
  }
  rateBook(id: $id, rating: $rating) @include(if: $rate) {
    ...BookDetail
  }
  removeBookRating(id: $id) @include(if: $unrate) {
    ...BookDetail
  }
}

mutation SetReadingStatus($id: BookId!, $status: ReadingStatus!) {
  setReadingStatus(id: $id, status: $status) {
    ...BookDetail
  }
}

mutation RateBook($id: BookId!, $rating: StarRating!) {
  rateBook(id: $id, rating: $rating) {
    ...BookDetail
  }
}

mutation SetBookHidden($id: BookId!, $hidden: Boolean!) {
  setBookHidden(id: $id, hidden: $hidden) {
    ...BookDetail
  }
}

mutation SetBookFavorite($id: BookId!, $favorite: Boolean!) {
  setBookFavorite(id: $id, favorite: $favorite) {
    ...BookDetail
  }
}

mutation DeleteBook($id: BookId!) {
  deleteBook(id: $id)
}

fragment BookDetail on Book {
  id
  title
  authors
  format
  publisher
  firstPublishedIn
  synopsis
  genre
  subgenres
  pageCount
  durationMinutes
  listeningProgress
  narrators
  language
  isbn13
  coverUrl
  status
  rating
  seriesRating
  favorite
  note
  hidden
  addedAt
  startedAt
  finishedAt
  series {
    id
    name
    volume
    kind
  }
}

# The reader's own subgenre vocabulary, most used first: what the genre sheet
# proposes as they type. Costs the server the same scan as the library.
query Subgenres {
  subgenres
}

# What the edit form proposes as the reader types, in one request and one scan
# of the library: their subgenres, most used first, and the sagas they hold,
# each named once.
query EditVocabulary {
  vocabulary {
    subgenres
    sagas
  }
}
