# Everything a narrator's page draws, in one request: the reader's recordings in
# their voice, the sagas as the Series tab draws them, the rest with everything
# their row shows. Free on the server — Wikipedia alone is asked for the face,
# the first time anybody opens it. `offered` names a narrator of a friend's
# recording whom the reader may hold nothing of.
query NarratorPage($key: NarratorKey!, $offered: NarratorName) {
  narratorPage(key: $key, offered: $offered) {
    narrator {
      key
      name
      portraitUrl
      favorite
      bookCount
      readCount
      seriesCount
      averageRating
    }
    sagas {
      ...FollowedSeriesRow
      volumes {
        ...FollowedVolume
      }
      catalogue {
        ...CatalogueSpine
      }
    }
    books {
      ...BookSummary
    }
  }
}

# Heart the narrator, or take the heart back. Answers what is now true.
mutation SetNarratorFavorite($key: NarratorKey!, $favorite: Boolean!) {
  setNarratorFavorite(key: $key, favorite: $favorite)
}
