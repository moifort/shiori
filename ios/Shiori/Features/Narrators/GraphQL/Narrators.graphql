# Everything a narrator's page draws, in one request: who they are, the
# reader's recordings in their voice, the sagas as the Series tab draws them,
# the rest with everything their row shows. The first opening, by anyone,
# builds the narrator's shared catalogue — a web-grounded model call and a
# Wikipedia lookup for the face. `waitForCatalogue: false` answers at once for
# a narrator nobody described, `awaitingCatalogue` set; the screen then asks
# again with true while the recordings are on screen. `offered` names a
# narrator of a friend's recording whom the reader may hold nothing of.
query NarratorPage($key: NarratorKey!, $offered: NarratorName, $waitForCatalogue: Boolean!) {
  narratorPage(key: $key, offered: $offered, waitForCatalogue: $waitForCatalogue) {
    ...NarratorPageFields
  }
}

fragment NarratorPageFields on NarratorPage {
  awaitingCatalogue
  narrator {
    key
    name
    portraitUrl
    favorite
    bookCount
    readCount
    seriesCount
    averageRating
  }
  catalogue {
    nationality
    birthYear
    deathYear
    biography
  }
  sagas {
    ...FollowedSeriesRow
    volumes {
      ...FollowedVolume
    }
    catalogue {
      ...CatalogueSpine
    }
  }
  books {
    ...BookSummary
  }
}

# Correct what the world knows of the narrator, for every reader: omitted
# fields are left alone, null ones cleared. Answers the page as it now reads.
mutation CorrectNarrator(
  $key: NarratorKey!
  $nationality: Nationality
  $birthYear: Year
  $deathYear: Year
  $biography: NarratorBiography
  $portraitUrl: PortraitUrl
) {
  correctNarrator(
    key: $key
    nationality: $nationality
    birthYear: $birthYear
    deathYear: $deathYear
    biography: $biography
    portraitUrl: $portraitUrl
  ) {
    ...NarratorPageFields
  }
}

# The faces the reader may give the narrator: the one drawn now first, then
# Wikipedia's. Free on the server.
query NarratorPortraitChoices($key: NarratorKey!) {
  narratorPortraitChoices(key: $key) {
    source
    url
    isCurrent
  }
}

# Heart the narrator, or take the heart back. Answers what is now true.
mutation SetNarratorFavorite($key: NarratorKey!, $favorite: Boolean!) {
  setNarratorFavorite(key: $key, favorite: $favorite)
}
