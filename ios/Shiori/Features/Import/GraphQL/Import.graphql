# Importing an Audible library.
#
# The sign-in is a three-step dance: the server opens it, the app drives Amazon's
# own page in a web view, and the server trades the code it catches for device
# credentials it keeps. The app never holds a credential.

# The connection and the library behind it, in one request: a reader who never
# connected comes back with no account, hence no library and no error.
query AudibleImport {
  audibleAccount {
    ...AudibleAccountSummary
    library {
      ...ImportableAudibleBook
    }
  }
}

fragment AudibleAccountSummary on AudibleAccount {
  marketplace
  connectedAt
  lastImportedAt
  autoSync
}

# The page to load, the cookies to plant first — they are what makes the request
# look like the Audible iOS app — and the redirect carrying the code back.
mutation StartAudibleLogin($marketplace: AudibleMarketplace!) {
  startAudibleLogin(marketplace: $marketplace) {
    url
    redirectUrl
    cookies {
      name
      value
      domain
    }
  }
}

mutation CompleteAudibleLogin($authorizationCode: String!) {
  completeAudibleLogin(authorizationCode: $authorizationCode) {
    ...AudibleAccountSummary
  }
}

# A proposal, not a record: nothing is catalogued until `ImportAudibleBooks` is
# called with the ASINs the reader ticked.
fragment ImportableAudibleBook on ImportableBook {
  asin
  title
  authors
  narrators
  durationMinutes
  coverUrl
  seriesName
  volume
  status
  finishedAt
  alreadyInLibrary
}

mutation ImportAudibleBooks($asins: [AudibleAsin!]!) {
  importAudibleBooks(asins: $asins) {
    ...BookSummary
  }
}

# The nightly pass, on or off. Answers with the account, so the screen draws the
# setting that was stored rather than the one it optimistically flipped.
mutation SetAudibleAutoSync($enabled: Boolean!) {
  setAudibleAutoSync(enabled: $enabled) {
    ...AudibleAccountSummary
  }
}

# The same pass the nightly job runs, asked for now. Answers with the account so
# the screen redraws its date and its counts in one round trip — and, for the
# import screen, with the library as the pass left it. The background refresh
# leaves the library out: it draws nothing, and it would cost Amazon a second call.
mutation SyncAudibleNow($withLibrary: Boolean!) {
  syncAudibleNow {
    imported
    updated
    account {
      ...AudibleAccountSummary
      library @include(if: $withLibrary) {
        ...ImportableAudibleBook
      }
    }
  }
}

mutation DisconnectAudible {
  disconnectAudible
}

# The Amazon data export, read into books to tick. Saves nothing: the reader
# picks, and `importKindleBooks` catalogues what they picked from a second read
# of the same file.
mutation ReadKindleExport($csv: String!) {
  readKindleExport(csv: $csv) {
    key
    title
    authors
    alreadyInLibrary
  }
}

mutation ImportKindleBooks($csv: String!, $keys: [String!]!) {
  importKindleBooks(csv: $csv, keys: $keys) {
    ...BookDetail
  }
}
