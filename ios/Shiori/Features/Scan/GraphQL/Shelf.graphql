# Every book in one shelf photo, with where it sits. Premium only; spends
# nothing — each book kept is its own AddDetectedBook.
mutation DetectBooks($imageBase64: String!) {
  detectBooks(imageBase64: $imageBase64) {
    title
    authors
    publisher
    language
    format
    media
    seriesName
    volume
    owned
    box {
      x
      y
      width
      height
    }
  }
}

# One ticked book, saved from what its spine printed, its page described on
# its first opening. Spends one scan, and no model call.
mutation AddDetectedBook($book: DetectedBookInput!) {
  addDetectedBook(book: $book) {
    ...BookDetail
  }
}
