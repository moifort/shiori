# Reads a cover and returns a record for the reader to review. Nothing is saved:
# `addBook` persists what they approve.
mutation ScanBook($imageBase64: String!) {
  scanBook(imageBase64: $imageBase64) {
    ...ScannedRecord
  }
}

# Looks a book up from a page the reader shared: the page is fetched for its
# title, and the rest is the lookup below.
mutation ScanLink($url: String!) {
  scanLink(url: $url) {
    ...ScannedRecord
  }
}

# Looks a book up from a title the reader typed, as remembered: the same
# proposal as a scan, without a cover to read.
mutation LookUpTitle($title: BookTitle!) {
  scanTitle(title: $title) {
    ...ScannedRecord
  }
}

# The books a typed title may mean, for the reader to pick before
# `LookUpTitle` builds the record. Quick, and spends nothing.
mutation SearchTitle($title: BookTitle!) {
  searchTitle(title: $title) {
    title
    authors
    firstPublishedIn
    seriesName
    volume
  }
}

fragment ScannedRecord on ScanResult {
  recognized
  title
  authors
  format
  media
  publisher
  firstPublishedIn
  synopsis
  genre
  subgenres
  pageCount
  isbn13
  language
  coverUrl
  series {
    id
    name
    volume
    kind
  }
  # The copy the reader already keeps, for the review to warn before a second
  # one lands on the shelf.
  ownedCopy {
    ...BookSummary
  }
}
