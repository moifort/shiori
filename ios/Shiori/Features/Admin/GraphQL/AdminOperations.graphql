query AdminMetrics {
  adminMetrics {
    costs {
      geminiEur
      infraEur
      totalEur
      projectedEur
      previousMonthEur
      changeVsPreviousMonth
      billedThrough
      days {
        day
        geminiEur
        infraEur
      }
    }
    sessions {
      day
      sessions
    }
    totalUsers
    newUsers
    premiumTotal
    newPremium
    revenueProceedsEur
    revenueGrossEur
    scans
    cacheHits
    searches
    enrichment {
      ...AiStepUsageFields
    }
    catalogue {
      ...AiStepUsageFields
    }
    discovery {
      ...AiStepUsageFields
    }
    refreshedAt
  }
}

fragment AiStepUsageFields on AiTokenUsage {
  searches
}
