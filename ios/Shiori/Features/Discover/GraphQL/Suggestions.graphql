# The month's discoveries: the books Claude chose from the reader's hearts
# and stars, each with why, in one format. With lookUp — Découvrir — the first
# look of a month waits for the model, about a minute; without, the stored
# selection is read.
query MonthlyDiscoveries($format: ReleaseFormat!, $lookUp: Boolean) {
  monthlyDiscoveries(format: $format, lookUp: $lookUp) {
    ...MonthlyDiscoveriesFields
  }
}

fragment MonthlyDiscoveriesFields on MonthlyDiscoveries {
  month
  status
  needsRatings
  suggestions {
    ...SuggestionFields
  }
}

# "Pas intéressé" or "Je n'aime pas": never suggested again, and why told to
# the model.
mutation DismissSuggestion($id: String!, $reason: DismissalReason!) {
  dismissSuggestion(id: $id, reason: $reason)
}

mutation ReconsiderSuggestion($id: String!) {
  reconsiderSuggestion(id: $id)
}

fragment SuggestionFields on Suggestion {
  id
  format
  kind
  reason
  short
  references {
    bookId
    seriesId
    title
    citesSaga
    favorite
    rating
    viaSeries
    coverUrl
  }
  release {
    ...ReleaseFields
  }
  # Read by Android until its release-time port: iOS draws `release`.
  title
  originalTitle
  originalLanguage
  authors
  state
  watched
  date
  coverUrl
  storeUrl
  awaitableFormats
  awaitedEditionId
}
