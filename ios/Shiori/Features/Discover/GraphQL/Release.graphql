# A book the reader does not hold — an edition awaited, an award winner, a
# discovery, a saga's volume — as every list and its page draw it: one record,
# built on the server. Nothing is merged on the device.
fragment ReleaseFields on Release {
  key
  title
  originalTitle
  authors
  format
  releaseFormat
  language
  originalLanguage
  state
  watched
  date
  isbn13
  coverUrl
  storeUrl
  series {
    seriesId
    name
    volume
  }
  publisher
  firstPublishedIn
  synopsis
  genre
  subgenres
  pageCount
  narrators
  durationMinutes
  described
}

# Describe for its page what a list showed, named by its kind: the server
# answers the same release completed, kept for every reader. About ten seconds
# the first time.
mutation DescribeReleaseOf($item: ReleaseItemInput!) {
  describeReleaseOf(item: $item) {
    ...ReleaseFields
  }
}

# The covers any reader may pick for a book nobody here holds, the one its page
# draws now first. Free: no model call.
query ReleaseCoverChoices($key: String!, $drawn: CoverUrl) {
  releaseCoverChoices(key: $key, drawn: $drawn) {
    source
    url
    current
  }
}

# A cover picked for a book nobody here holds, drawn for every reader. Answers
# the cover now drawn.
mutation ChooseReleaseCover($key: String!, $url: CoverUrl!) {
  chooseReleaseCover(key: $key, url: $url)
}
