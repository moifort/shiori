# The novels the awards crowned, one section per genre the reader reads most,
# in one format, with where their edition stands in the app's language. Empty
# when the reader reads no genre with awards enough.
query AwardSections($format: ReleaseFormat!) {
  awardSections(format: $format) {
    genre
    winners {
      ...AwardWinnerFields
    }
  }
}

fragment AwardWinnerFields on AwardWinner {
  id
  format
  title
  originalTitle
  originalLanguage
  authors
  awards {
    award
    year
  }
  state
  watched
  date
  coverUrl
  storeUrl
  awaitable
  awaitedEditionId
}
