# The novels the awards crowned, one section per genre the reader reads most,
# in one format, with where their edition stands in the app's language. Empty
# when the reader reads no genre with awards enough.
query AwardSections($format: ReleaseFormat!) {
  awardSections(format: $format) {
    ...AwardSectionFields
  }
}

fragment AwardSectionFields on AwardSection {
  genre
  winners {
    ...AwardWinnerFields
  }
}

mutation DismissAwardWinner($key: String!) {
  dismissAwardWinner(key: $key)
}

mutation ReconsiderAwardWinner($key: String!) {
  reconsiderAwardWinner(key: $key)
}

fragment AwardWinnerFields on AwardWinner {
  id
  key
  format
  awards {
    award
    year
  }
  release {
    ...ReleaseFields
  }
  # Read by Android until its release-time port: iOS draws `release`.
  title
  originalTitle
  originalLanguage
  authors
  state
  watched
  date
  coverUrl
  storeUrl
  awaitableFormats
  awaitedEditionId
}
