# The Découvrir tab: the books the reader read in another language, now out or
# coming out in the app's language.

query Discover {
  discover {
    ...DiscoverFields
  }
}

mutation RefreshDiscover {
  refreshDiscover {
    ...DiscoverFields
  }
}

mutation DismissTranslation($key: String!) {
  dismissTranslation(key: $key)
}

fragment DiscoverFields on Discover {
  preparedAt
  canRefresh
  upcoming {
    ...TranslationFields
  }
  available {
    ...TranslationFields
  }
}

fragment TranslationFields on Translation {
  key
  kind
  title
  originalTitle
  author
  originalLanguage
  volumesRead
  coverUrl
  nextDate
  editions {
    title
    volume
    format
    date
    audibleUrl
  }
}
