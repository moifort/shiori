# The Découvrir tab: what is coming next in the sagas the reader follows, in the
# language they read each in and in the app's, and what may interest them.

query Discover {
  discover {
    ...DiscoverFields
  }
}

mutation RefreshDiscover {
  refreshDiscover {
    ...DiscoverFields
  }
}

mutation DismissRelease($key: String!) {
  dismissRelease(key: $key)
}

# A book of the tab the reader does not hold, built whole as a scan builds one
# so the book screen draws it. A few seconds the first time anybody opens it.
query BookPreview($releaseKey: String!, $title: BookTitle!) {
  bookPreview(releaseKey: $releaseKey, title: $title) {
    ...ScannedRecord
  }
}

fragment DiscoverFields on Discover {
  preparedAt
  canRefresh
  upcoming {
    ...ReleaseFields
  }
  maybe {
    ...ReleaseFields
  }
}

# A saga's release carries its Series tab row in that language — the same
# selection as the tab's rows, so it draws exactly as they do.
fragment ReleaseFields on Release {
  key
  kind
  seriesId
  language
  readIn
  title
  author
  coverUrl
  nextDate
  editions {
    title
    volume
    format
    date
    isbn13
    coverUrl
    audibleUrl
  }
  series {
    ...FollowedSeriesRow
    volumes {
      ...FollowedVolume
    }
    catalogue {
      spine {
        ...VolumeEntry
      }
    }
  }
}
