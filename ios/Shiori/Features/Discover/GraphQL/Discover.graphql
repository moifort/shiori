# The Découvrir tab in one format: every saga the reader follows with a volume
# announced they do not hold, or one just out they can have now. A row carries the Series tab's selection, the
# catalogue's spine included, so it draws exactly as the Series tab's row does,
# every cover of its strip. And every author they hold in that format with a
# work announced or just out outside those sagas, drawn as the Authors shelf
# draws them.
query Discovery($format: ReleaseFormat!) {
  discovery(format: $format) {
    ...DiscoveryFields
  }
}

# The sagas of that format never looked up, looked up now: the first look at
# the tab waits for it rather than for the hourly pass. Up to a minute and a half.
mutation LookUpDiscovery($format: ReleaseFormat!) {
  lookUpDiscovery(format: $format) {
    ...DiscoveryFields
  }
}

fragment DiscoveryFields on Discovery {
  unwatched
  followed
  sagas {
    series {
      ...FollowedSeriesRow
      volumes {
        ...FollowedVolume
      }
      catalogue {
        spine {
          ...VolumeEntry
        }
      }
    }
    next {
      ...DiscoveredVolumeFields
    }
    missing
    recent {
      ...DiscoveredVolumeFields
    }
  }
  authors {
    author {
      ...FollowedAuthorRow
    }
    next {
      ...DiscoveredWorkFields
    }
    recent {
      ...DiscoveredWorkFields
    }
  }
}

# What the saga screen shows under its introduction, in the edition opened.
query SagaReleases($seriesId: SeriesId!, $language: BookLanguage!) {
  sagaReleases(seriesId: $seriesId, language: $language) {
    ...SagaReleasesFields
  }
}

# The same, the saga looked up on the web first when nobody ever did.
mutation LookUpSagaReleases($seriesId: SeriesId!, $language: BookLanguage!) {
  lookUpSagaReleases(seriesId: $seriesId, language: $language) {
    ...SagaReleasesFields
  }
}

fragment SagaReleasesFields on SagaReleases {
  watched
  next {
    ...DiscoveredVolumeFields
  }
}

# A volume announced, described for its page before the reader adds it: by the
# model for a printed one, off Audible's catalogue then by the model for a
# recording. Spends one scan; a few seconds.
mutation PreviewAnnouncedVolume(
  $seriesId: SeriesId!
  $language: BookLanguage!
  $number: VolumeNumber!
) {
  previewAnnouncedVolume(seriesId: $seriesId, language: $language, number: $number) {
    book {
      ...ScannedRecord
    }
    narrators
    durationMinutes
    releaseDate
    audibleUrl
  }
}

fragment DiscoveredVolumeFields on DiscoveredVolume {
  number
  title
  date
  isbn13
  coverUrl
  audibleUrl
}

fragment DiscoveredWorkFields on DiscoveredWork {
  title
  date
  isbn13
  coverUrl
  audibleUrl
  seriesName
  volume
}

# What the reader's friends hearted and the reader holds in no format, above
# every shelf: "Coups de cœur de vos amis". The books and the sagas carry the
# copy of the friend who hearted them last, the sagas their first volume only.
query FriendRecommendations {
  friendRecommendations {
    books {
      book {
        ...FriendBookRow
      }
      ...FriendLovedBookLovers
    }
    sagas {
      saga {
        ...FriendSagaRow
      }
      ...FriendLovedSagaLovers
    }
    authors {
      author {
        key
        name
        portraitUrl
      }
      ...FriendLovedAuthorLovers
    }
  }
}

fragment FriendLovedBookLovers on FriendLovedBook {
  friends {
    userId
    firstName
  }
  lovedByMany
}

fragment FriendLovedSagaLovers on FriendLovedSaga {
  friends {
    userId
    firstName
  }
  lovedByMany
}

fragment FriendLovedAuthorLovers on FriendLovedAuthor {
  friends {
    userId
    firstName
  }
  lovedByMany
}
