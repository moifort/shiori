# The Découvrir tab in one format: every saga the reader follows, with the
# volumes out they do not hold and the next one announced. A row carries the
# Series tab's selection, so it draws as the Series tab's rows do; its strip is
# built from the volumes held and the ones found, so no catalogue is asked for.
query Discovery($format: ReleaseFormat!) {
  discovery(format: $format) {
    series {
      ...FollowedSeriesRow
      volumes {
        ...FollowedVolume
      }
    }
    available {
      ...DiscoveredVolumeFields
    }
    next {
      ...DiscoveredVolumeFields
    }
  }
}

# What the saga screen shows under its introduction, in the edition opened.
query SagaReleases($seriesId: SeriesId!, $language: BookLanguage!) {
  sagaReleases(seriesId: $seriesId, language: $language) {
    available {
      ...DiscoveredVolumeFields
    }
    next {
      ...DiscoveredVolumeFields
    }
  }
}

fragment DiscoveredVolumeFields on DiscoveredVolume {
  number
  title
  date
  isbn13
  coverUrl
  store
  storeUrl
}
