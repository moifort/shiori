# Everything a signed-in launch needs, in one request: the wizard or the app,
# the admin surfaces, the first name and avatar the toolbar and the profile
# settings show, and the plan and
# allowance the subscription store starts from. The first name sits on the
# account document the routing flags are read from, so it costs no extra read.
query Launch {
  me {
    firstName
    onboardingCompleted
    isAdmin
    avatarHero
    avatarUrl
  }
  entitlement {
    ...EntitlementFields
  }
  quota {
    ...QuotaFields
  }
}

mutation CompleteOnboarding($input: CompleteOnboardingInput!) {
  completeOnboarding(input: $input) {
    userId
    firstName
    onboardingCompleted
  }
}

mutation ChangeAvatar($input: ChangeAvatarInput!) {
  changeAvatar(input: $input) {
    userId
    avatarHero
    avatarUrl
  }
}
