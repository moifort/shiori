# Everything a signed-in launch needs, in one request: the wizard or the app,
# the admin surfaces, and the plan and allowance the subscription store starts
# from.
query Launch {
  me {
    onboardingCompleted
    isAdmin
  }
  entitlement {
    ...EntitlementFields
  }
  quota {
    ...QuotaFields
  }
}

# The account alone, for the profile settings to prefill the first name.
query Me {
  me {
    userId
    firstName
    onboardingCompleted
    isAdmin
  }
}

mutation CompleteOnboarding($input: CompleteOnboardingInput!) {
  completeOnboarding(input: $input) {
    userId
    firstName
    onboardingCompleted
  }
}
