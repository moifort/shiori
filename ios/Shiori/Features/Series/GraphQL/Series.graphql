# The full catalogue of one saga. Everything the reader does not own comes back
# here as a proposal: the library query never returns these rows.
query Series($id: SeriesId!) {
  series(id: $id) {
    id
    name
    author
    description
    spine {
      ...VolumeEntry
    }
    relatedWorks {
      ...VolumeEntry
    }
  }
}

# The sagas the reader follows, taken from their own books rather than from the
# catalogue: a saga an import named and nobody described is still one they read.
# `state` is null exactly when there is no catalogue to derive it from.
query MySeries {
  mySeries {
    id
    name
    author
    state
    ownedCount
  }
}

fragment VolumeEntry on Volume {
  number
  title
  publishedIn
  kind
}
