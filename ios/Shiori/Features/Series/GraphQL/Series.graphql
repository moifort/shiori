# Everything the saga screen draws, in one request: the full catalogue — what
# the reader does not own comes back as a proposal —, what they make of the
# saga, and the volumes they hold, covers signed for those alone. The id is the
# edition the reader opened, as the server handed it out: a catalogue built on
# this opening titles its volumes as that edition does, and only that edition's
# volumes answer. A saga
# the reader holds nothing of — offered on an author's page — is catalogued from
# the `proposed` name and author. A saga nobody catalogued answers at once with
# the volumes held, `awaitingCatalogue` set: SeriesCatalogueBuilt follows.
query SeriesScreen($id: SeriesId!, $proposed: ProposedSagaInput) {
  series(id: $id, proposed: $proposed, waitForCatalogue: false) {
    ...SeriesCatalogue
  }
  seriesOpinion(seriesId: $id) {
    ...SeriesOpinionFields
  }
  mySeriesVolumes(seriesId: $id) {
    ...BookSummary
    # The hero's author line opens the author's page.
    authorKeys
  }
}

# A volume of a saga heard, added to the pile with Audible's own data — cover,
# summary, narrators, running time — read through the reader's account.
# `NOT_FOUND` when Audible sells no recording of it, `AUDIBLE_NOT_CONNECTED`
# without an account: the app then adds it by its title, as a book.
mutation AddAudibleSeriesVolume($seriesId: SeriesId!, $volume: VolumeNumber!) {
  addAudibleSeriesVolume(seriesId: $seriesId, volume: $volume) {
    ...BookDetail
  }
}

# The catalogue of a saga nobody had catalogued, built by the AI on this call:
# one grounded model call, while the screen shows the volumes held.
query SeriesCatalogueBuilt($id: SeriesId!, $proposed: ProposedSagaInput) {
  series(id: $id, proposed: $proposed) {
    ...SeriesCatalogue
  }
}

fragment SeriesCatalogue on Series {
  id
  language
  name
  audio
  author
  description
  provisional
  awaitingCatalogue
  catalogedAt
  spine {
    ...VolumeEntry
  }
  relatedWorks {
    ...VolumeEntry
  }
}

# One page of the sagas the reader follows, taken from their own books rather
# than from the catalogue: a saga an import named and nobody described is still
# one they read. `state` is null exactly when there is no catalogue to derive it
# from. For the tab that draws as it scrolls. Only the tab
# asks for the volumes: each one costs a signed cover URL. The catalogue's spine
# comes along so the strip can draw the volumes the reader does not own; the server
# reads every catalogue of the page in one getAll.
query MySeriesPage($limit: Int, $after: String, $loved: Boolean, $state: SeriesState) {
  mySeriesPage(limit: $limit, after: $after, loved: $loved, state: $state) {
    hasMore
    endCursor
    items {
      ...FollowedSeriesRow
      volumes {
        ...FollowedVolume
      }
      catalogue {
        ...CatalogueSpine
      }
    }
  }
}

# One row of the tab, asked again once the reader has changed that saga: the
# same selection as a page's rows, so the patched row draws exactly as the
# others do.
query MyFollowedSeries($seriesId: SeriesId!) {
  myFollowedSeries(seriesId: $seriesId) {
    ...FollowedSeriesRow
    volumes {
      ...FollowedVolume
    }
    catalogue {
      ...CatalogueSpine
    }
  }
}

# The catalogue behind a row's strip: its spine, and when it was built — one
# built before the catalogues of each edition lists other editions' volumes.
fragment CatalogueSpine on Series {
  catalogedAt
  spine {
    ...VolumeEntry
  }
}

# One cover of a row's strip: enough to draw it, pin its status on it, and
# place it against the catalogue's numbering.
fragment FollowedVolume on Book {
  id
  title
  coverUrl
  status
  format
  language
  series {
    volume
    kind
  }
}

# Removes one edition of a saga from the library: a saga held in two languages
# is two rows under two series ids, removed apart.
mutation DeleteSeries($seriesId: SeriesId!) {
  deleteSeries(seriesId: $seriesId)
}

# The sagas a duplicate can be folded into: every saga the reader holds, one
# row per edition, without the covers the tab signs.
query MergeCandidates {
  mySeries {
    ...FollowedSeriesRow
  }
}

# Folds a duplicate saga into the one the reader keeps: the volumes of the
# edition the reader stands in move there at their numbers, and the duplicate
# leaves the library. Answers how many books moved.
mutation MergeSeries($seriesId: SeriesId!, $intoSeriesId: SeriesId!) {
  mergeSeries(seriesId: $seriesId, intoSeriesId: $intoSeriesId)
}

fragment FollowedSeriesRow on FollowedSeries {
  id
  saga
  name
  audio
  author
  language
  genre
  state
  ownedCount
  shelvedAt
  opinion {
    ...SeriesOpinionFields
  }
}

# A volume of the catalogue, with when it comes out in each language the
# release watch found it in: what decides, for one edition, whether it is out.
fragment VolumeEntry on Volume {
  number
  title
  publishedIn
  kind
  releases {
    language
    date
    title
    coverUrl
  }
}

mutation RateSeries($seriesId: SeriesId!, $rating: StarRating!) {
  rateSeries(seriesId: $seriesId, rating: $rating) {
    ...SeriesOpinionFields
  }
}

mutation RemoveSeriesRating($seriesId: SeriesId!) {
  removeSeriesRating(seriesId: $seriesId) {
    ...SeriesOpinionFields
  }
}

# Set one edition of a saga aside, or follow it again. Only the saga: its
# volumes keep their own statuses.
mutation SetSeriesFollowed($seriesId: SeriesId!, $followed: Boolean!) {
  setSeriesFollowed(seriesId: $seriesId, followed: $followed) {
    ...SeriesOpinionFields
  }
}

mutation SetSeriesFavorite($seriesId: SeriesId!, $favorite: Boolean!) {
  setSeriesFavorite(seriesId: $seriesId, favorite: $favorite) {
    ...SeriesOpinionFields
  }
}

# How many volumes the saga has, by the reader's own count, for a saga nobody
# has catalogued. The server draws a provisional catalogue from it.
mutation DeclareSeriesVolumeCount($seriesId: SeriesId!, $count: VolumeNumber!) {
  declareSeriesVolumeCount(seriesId: $seriesId, count: $count) {
    ...SeriesOpinionFields
  }
}

fragment SeriesOpinionFields on SeriesOpinion {
  seriesId
  rating
  favorite
  followed
  unfollowedLanguages
  volumeCount
}
