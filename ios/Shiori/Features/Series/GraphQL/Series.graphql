# The full catalogue of one saga. Everything the reader does not own comes back
# here as a proposal: the library query never returns these rows. The language
# is the edition the reader opened: a catalogue built on this opening titles
# its volumes as that edition does.
query Series($id: SeriesId!, $language: BookLanguage) {
  series(id: $id, language: $language) {
    ...SeriesCatalogue
  }
}

# Ask the world about the saga again. The fresh catalogue replaces the stored
# one for everyone; null means it could not be rebuilt and the old one stands.
mutation RefreshSeries($seriesId: SeriesId!, $language: BookLanguage) {
  refreshSeries(seriesId: $seriesId, language: $language) {
    ...SeriesCatalogue
  }
}

fragment SeriesCatalogue on Series {
  id
  name
  author
  description
  provisional
  spine {
    ...VolumeEntry
  }
  relatedWorks {
    ...VolumeEntry
  }
}

# The sagas the reader follows, taken from their own books rather than from the
# catalogue: a saga an import named and nobody described is still one they read.
# `state` is null exactly when there is no catalogue to derive it from.
query MySeries {
  mySeries {
    ...FollowedSeriesRow
  }
}

# One page of the same rows, for the tab that draws as it scrolls. Only the tab
# asks for the volumes: each one costs a signed cover URL. The catalogue comes
# along so the strip can draw the volumes the reader does not own; the server
# reads every catalogue of the page in one getAll.
query MySeriesPage($limit: Int, $offset: Int, $favorite: Boolean, $state: SeriesState) {
  mySeriesPage(limit: $limit, offset: $offset, favorite: $favorite, state: $state) {
    hasMore
    items {
      ...FollowedSeriesRow
      volumes {
        ...FollowedVolume
      }
      catalogue {
        spine {
          ...VolumeEntry
        }
        relatedWorks {
          ...VolumeEntry
        }
      }
    }
  }
}

# One cover of a row's strip: enough to draw it, pin its status on it, and
# place it against the catalogue's numbering.
fragment FollowedVolume on Book {
  id
  title
  coverUrl
  status
  format
  series {
    volume
    kind
  }
}

mutation DeleteSeries($seriesId: SeriesId!) {
  deleteSeries(seriesId: $seriesId)
}

fragment FollowedSeriesRow on FollowedSeries {
  id
  name
  author
  language
  genre
  state
  ownedCount
  shelvedAt
  opinion {
    ...SeriesOpinionFields
  }
}

fragment VolumeEntry on Volume {
  number
  title
  publishedIn
  kind
}

# What the reader makes of one saga. A root query rather than a field on Series:
# the shared catalogue holds no reference to any reader and must stay that way.
query SeriesOpinion($seriesId: SeriesId!) {
  seriesOpinion(seriesId: $seriesId) {
    ...SeriesOpinionFields
  }
}

mutation RateSeries($seriesId: SeriesId!, $rating: StarRating!) {
  rateSeries(seriesId: $seriesId, rating: $rating) {
    ...SeriesOpinionFields
  }
}

mutation RemoveSeriesRating($seriesId: SeriesId!) {
  removeSeriesRating(seriesId: $seriesId) {
    ...SeriesOpinionFields
  }
}

mutation SetSeriesFavorite($seriesId: SeriesId!, $favorite: Boolean!) {
  setSeriesFavorite(seriesId: $seriesId, favorite: $favorite) {
    ...SeriesOpinionFields
  }
}

# How many volumes the saga has, by the reader's own count, for a saga nobody
# has catalogued. The server draws a provisional catalogue from it.
mutation DeclareSeriesVolumeCount($seriesId: SeriesId!, $count: VolumeNumber!) {
  declareSeriesVolumeCount(seriesId: $seriesId, count: $count) {
    ...SeriesOpinionFields
  }
}

fragment SeriesOpinionFields on SeriesOpinion {
  seriesId
  rating
  favorite
  volumeCount
}
