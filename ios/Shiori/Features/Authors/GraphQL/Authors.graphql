# One page of the authors the reader holds books of, the ones they love first:
# most hearts, then the best mean of stars, then the most books. Each comes with
# every book of theirs, covers signed for this page alone.
query MyAuthorsPage($limit: Int, $after: String, $favorite: Boolean, $order: AuthorOrder) {
  myAuthorsPage(limit: $limit, after: $after, favorite: $favorite, order: $order) {
    hasMore
    endCursor
    items {
      ...FollowedAuthorRow
    }
  }
}

# An author as the Authors shelf draws their row: in the Library, and on
# Découvrir's Authors shelf.
fragment FollowedAuthorRow on FollowedAuthor {
  key
  name
  indexLetter
  portraitUrl
  favorite
  bookCount
  seriesCount
  favoriteCount
  averageRating
  shelvedAt
  # Each with what its cover's line says: stars, "Ajouté", the bookmark.
  books {
    ...BookSummary
  }
}

# Everything an author's page draws, in one request. The first opening, by
# anyone, builds the author's shared catalogue — a web-grounded model call and a
# Wikipedia lookup for the portrait — so it can take a while; every later one
# reads it. The sagas come as the Series tab draws them; the books outside any
# saga with everything their row shows. `offered` names an author a friend
# loves whom the reader holds nothing of, opened from Découvrir.
# `waitForCatalogue: false` answers at once for an author nobody described,
# `awaitingCatalogue` set; the screen then asks again with true, and the AI
# builds the catalogue while the reader's books are on screen.
query AuthorPage($key: AuthorKey!, $offered: AuthorName, $waitForCatalogue: Boolean!) {
  authorPage(key: $key, offered: $offered, waitForCatalogue: $waitForCatalogue) {
    awaitingCatalogue
    author {
      key
      name
      indexLetter
      portraitUrl
      favorite
      bookCount
      readCount
      seriesCount
      favoriteCount
      averageRating
    }
    catalogue {
      nationality
      birthYear
      deathYear
      biography
    }
    sagas {
      ...FollowedSeriesRow
      volumes {
        ...FollowedVolume
      }
      catalogue {
        ...CatalogueSpine
      }
    }
    printSagasNotHeld: sagasNotHeld(audio: false) {
      ...AuthorSeriesFields
    }
    books {
      ...BookSummary
    }
    booksNotHeld {
      title
      publishedIn
      coverUrl
    }
  }
}

# A saga of the author the reader holds nothing of in one format, with the id
# its catalogue is keyed on in that format: the saga heard is a saga of its own.
fragment AuthorSeriesFields on AuthorSeries {
  id
  name
  author
  volumeCount
  firstVolumeTitle
  coverUrl
}

# Heart the author, or take the heart back. Answers what is now true.
mutation SetAuthorFavorite($key: AuthorKey!, $favorite: Boolean!) {
  setAuthorFavorite(key: $key, favorite: $favorite)
}
