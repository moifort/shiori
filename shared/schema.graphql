"""
The reader's live link to Audible.

The credentials themselves never leave the server. Disconnecting forgets our copy of them; the device stays registered on the Amazon side until the reader removes it there.
"""
type AudibleAccount {
  """
  Whether the nightly sync runs for this reader.
  
  When on, a pass each night catalogues the titles bought since the last one and moves the status of imported books to follow the listening — without asking. Ratings, notes and hidden books are never touched. Turn it off with `setAudibleAutoSync` to go back to importing by hand.
  """
  autoSync: Boolean!
  connectedAt: DateTime!

  """Null until the first import, then moved by every nightly sync."""
  lastImportedAt: DateTime
  marketplace: AudibleMarketplace!
}

"""
Amazon's identifier for one audiobook: ten upper-case alphanumeric characters.

Handed out by `audibleLibrary` and passed straight back to `importAudibleBooks` to say which titles to catalogue. Example: "B002V1OF70".
"""
scalar AudibleAsin

"""
A cookie to plant in the web view before loading the sign-in page.

They are what makes the request look like the Audible iOS app. Without them Amazon challenges the sign-in far more often, so they are not optional garnish.
"""
type AudibleCookie {
  domain: String!
  name: String!
  value: String!
}

"""
Everything needed to run the Amazon sign-in in a web view.

Plant the cookies, load `url`, and watch navigation for `redirectUrl`: it carries the authorization code as the `openid.oa2.authorization_code` query parameter. Hand that code to `completeAudibleLogin` and close the view. The sign-in is good for thirty minutes.
"""
type AudibleLogin {
  cookies: [AudibleCookie!]!

  """The landing URL whose query string carries the authorization code."""
  redirectUrl: String!

  """The Amazon sign-in page to load."""
  url: String!
}

"""
The Amazon store an Audible account was opened on.

It decides which domain the sign-in page and the API live on, so a connection made on the wrong one simply finds an empty library. The reader picks it once, when connecting.
"""
enum AudibleMarketplace {
  """audible.ca"""
  CA

  """audible.com (United States)"""
  COM

  """audible.com.au"""
  COM_AU

  """audible.co.jp"""
  CO_JP

  """audible.co.uk"""
  CO_UK

  """audible.de"""
  DE

  """audible.es"""
  ES

  """audible.fr"""
  FR

  """audible.in"""
  IN

  """audible.it"""
  IT
}

"""
An author name as printed, 1 to 200 characters. Example: "Patrick Rothfuss".
"""
scalar AuthorName

"""
A book as one reader holds it.

Private and owned by exactly one reader: two people who scan the same novel keep two independent records. Public facts (title, synopsis, series) and personal judgment (status, rating, note) sit side by side, because the record belongs to the reader rather than to the world.
"""
type Book {
  addedAt: DateTime!

  """Empty when nothing legible was found, never null."""
  authors: [AuthorName!]!

  """
  The cover to draw: the reader own photo when there is one, otherwise the publisher cover found by ISBN at scan time. Null when neither exists, and the app draws a typographic placeholder — as it must when the URL fails to load, since a published cover can disappear from its source.
  """
  coverUrl: CoverUrl

  """
  An audiobook's running time in whole minutes. Null on anything else, and null on an audiobook no import ever timed — a scanned cover does not say how long the recording is.
  """
  durationMinutes: Int

  """
  A book the reader keeps close. Decoupled from the rating: a five-star novel one never wants to open again and a three-star one kept for what it meant are both real, and one field cannot say both.
  """
  favorite: Boolean!
  finishedAt: DateTime

  """Year the work first appeared, not the year of this edition."""
  firstPublishedIn: Year
  format: BookFormat!

  """Null for a book added by hand, or when the reader cleared it."""
  genre: Genre

  """Excluded from any shared view. Sharing itself is not built yet."""
  hidden: Boolean!
  id: BookId!
  isbn13: Isbn13

  """
  The language of this edition, read off the cover at scan time. Null on a book catalogued before the scan started reading it, and on any edition in a language the closed list does not carry.
  """
  language: BookLanguage

  """
  Who reads the recording, at most five. Empty on anything but an audiobook, and empty on an audiobook no import ever named.
  """
  narrators: [NarratorName!]!
  note: ReadingNote
  pageCount: PageCount
  publisher: Publisher

  """One to five whole stars. Null until the reader rates it."""
  rating: StarRating

  """Null for a standalone book."""
  series: SeriesMembership
  startedAt: DateTime
  status: ReadingStatus!

  """Zero to three free labels refining the genre. Empty, never null."""
  subgenres: [Subgenre!]!
  synopsis: Synopsis
  title: BookTitle!
}

"""
Corrections to a book record. Omitted fields are left as they are; null clears a field (an empty list for authors, subgenres and narrators). Title and format ignore null.
"""
input BookEditInput {
  authors: [AuthorName!]
  firstPublishedIn: Year
  format: BookFormat
  genre: Genre
  isbn13: Isbn13
  language: BookLanguage

  """At most five."""
  narrators: [NarratorName!]
  pageCount: PageCount
  publisher: Publisher

  """At most three."""
  subgenres: [Subgenre!]
  synopsis: Synopsis
  title: BookTitle
}

"""
What kind of object the reader holds.

Prose, sound, or a drawn story. Drawn stories are split into the three traditions readers shelve apart. Defaults to `BOOK` when nothing says otherwise.
"""
enum BookFormat {
  """A book listened to."""
  AUDIOBOOK

  """A Franco-Belgian comic album, such as Astérix or Blacksad."""
  BANDE_DESSINEE

  """A printed book: novel, essay, anything in prose."""
  BOOK

  """An American comic book or graphic novel."""
  COMIC

  """A book read on a screen."""
  EBOOK

  """A Japanese comic, or one drawn in that tradition."""
  MANGA
}

"""
Identifier of one book in one reader library, as a UUID v4.

Scoped to its owner: the same novel catalogued by two readers has two unrelated ids. Example: "f9b1c2d0-4e3a-4c21-9f77-1a2b3c4d5e6f".
"""
scalar BookId

"""
The language an edition is printed or recorded in — the object on the shelf, never the language the app is being used in.

A closed list, for the reason `Genre` is closed and one of its own: the app draws a flag per language, and an arbitrary ISO code has no flag to draw. An edition in a language the list does not carry keeps no language at all, rather than an `OTHER` that would be a second way of saying "unknown".
"""
enum BookLanguage {
  AR
  DE
  EN
  ES
  FR
  IT
  JA
  KO
  NL
  PL
  PT
  RU
  SV
  TR

  """Ukrainian."""
  UK
  ZH
}

"""
The title of a book, 1 to 300 characters.

Bounded because it often comes from a model reading a cover: a 500-character "title" is a misread blurb. Example: "The Name of the Wind".
"""
scalar BookTitle

"""
One version section of the application release notes.

Parsed from the served changelog document: a version heading, its release date, and the flat list of note lines under it. The app renders it as a row titled by `version` with the formatted `date` on the right and `notes` as bullet points.
"""
type ChangelogEntry {
  """Release date of the version; null for a pending (unreleased) section"""
  date: DateTime

  """Release note lines for this version, shown as a flat bullet list"""
  notes: [String!]!

  """App Store version this section documents (e.g. "1.3")"""
  version: String!
}

"""
What the onboarding wizard collects.

Only a first name, so the app can address the reader. Vinarium also sizes a cellar grid here; a library has no shape to declare up front.
"""
input CompleteOnboardingInput {
  """The reader's first name."""
  firstName: PersonName!
}

"""A non-negative whole number of things. Example: 12."""
scalar Count

"""
An HTTPS URL to draw a book cover from.

Either the reader own photo, signed and expiring after an hour, or the publisher cover found by ISBN. Neither is guaranteed to load: draw the placeholder when the image fails, and refetch the book rather than storing the URL client-side.
"""
scalar CoverUrl

"""
The home dashboard: reading statistics and the shelves worth a glance.

Read from a view rebuilt on every book write, then set against today, so it costs one document read. A section with nothing to show comes back empty or null, and the app leaves it out rather than drawing zeros.
"""
type Dashboard {
  """One decimal. Null when no finished book is rated."""
  averageRating: Float

  """From the first finished book to this year, nine years at most."""
  booksPerYear: [YearCount!]!
  currentYear: Int!

  """Median days from start to finish, both days included."""
  daysToFinish: Trend!

  """Books finished this year: four genres, then one "others" segment."""
  genres: [GenreCount!]!

  """The twelve months of the current year."""
  hoursPerMonth: [MonthHours!]!
  lastFinished: DashboardBook

  """True when the reader has not catalogued a single book yet."""
  libraryIsEmpty: Boolean!

  """At the pace of the last twelve months. Null with no pile or no pace."""
  monthsToClearPile: Int
  pagesPerDay: Trend!

  """The twelve months of the current year."""
  pagesPerMonth: [MonthPages!]!
  ratedCount: Int!

  """Most recently started first, ten at most."""
  reading: [DashboardBook!]!

  """Sagas in progress, most recent activity first, three at most."""
  series: [SeriesProgress!]!

  """Six books of the pile, drawn at random once a day."""
  suggestions: [DashboardBook!]!
  toReadCount: Int!
}

"""
A book as a dashboard tile draws it: a cover and two lines, nothing more.
"""
type DashboardBook {
  authors: [AuthorName!]!

  """Null without a photo or a published cover; draw the placeholder."""
  coverUrl: CoverUrl
  finishedAt: DateTime
  id: BookId!
  rating: StarRating
  startedAt: DateTime
  title: BookTitle!
}

"""
A date and time serialized as an ISO 8601 string in UTC.

On output a JavaScript `Date` is rendered as an ISO string; on input an ISO string is parsed back into a `Date`. Used for record timestamps (`addedAt`, `startedAt`, `finishedAt`). Example: "2026-09-14T09:30:00.000Z".
"""
scalar DateTime

"""
What the account is entitled to, and what the App Store sold to get there.

Read it before starting a purchase: `appAccountToken` is what ties the payment back to this account, and a purchase made without it cannot be matched to anyone.
"""
type Entitlement {
  """
  The UUID to pass to StoreKit as the purchase’s account token, e.g. `"20099a54-f027-5426-b2f0-79d90a5050f1"`. Without it a purchase cannot be matched to this account, and syncing it will be refused.
  """
  appAccountToken: String!

  """
  When the paid period ends, e.g. `"2027-07-21T09:12:00.000Z"` — null when there is no subscription. A cancelled subscription keeps its Premium until this date.
  """
  expiresOn: DateTime

  """The plan in force right now, e.g. `PREMIUM`"""
  plan: Plan!

  """
  The subscription bought, e.g. `"com.polyforms.vinarium.app.premium.yearly"` — null when there is none
  """
  productId: String
}

"""An amount in euros, never negative. Example: 2.99."""
scalar Eur

"""A saga the reader owns at least one volume of."""
type FollowedSeries {
  """
  The author of a volume the reader owns, which is what answers for a saga the catalogue has never described.
  """
  author: AuthorName

  """
  What the world knows of the saga. Null until somebody scans a volume of it: an import and a manual entry both name a saga without describing it.
  """
  catalogue: Series
  id: SeriesId!

  """
  The language the reader holds these volumes in. A saga held in two languages answers twice, once per language, sharing one `id` — so a client keying rows on the id alone must key on the pair instead.
  """
  language: BookLanguage
  name: SeriesName!

  """
  What the reader makes of the saga. Null until they say something about it.
  
  Held per saga, so the two rows of a saga held in two languages answer with the same opinion: the split is about editions, this is about the work.
  """
  opinion: SeriesOpinion

  """How many volumes of the saga are in the library."""
  ownedCount: Count!

  """
  Derived, never stored. COMPLETE once every published volume has been read.
  
  Null without a catalogue: which volumes exist is exactly what is unknown then, and IN_PROGRESS would be a guess dressed as a fact.
  """
  state: SeriesState
}

"""
What a book is about, from a closed list.

Closed so that statistics can count against it; nuance goes to subgenres. Audience (young adult, children) is not a genre, and the object (manga, comic) is the format. `OTHER` when nothing fits.
"""
enum Genre {
  ADVENTURE
  ART

  """Biographies and memoirs."""
  BIOGRAPHY

  """Economics and business."""
  BUSINESS
  COOKING

  """Detective and police fiction."""
  CRIME

  """Plays."""
  DRAMA
  ESSAY
  FANTASY
  HISTORICAL_FICTION

  """Non-fiction history."""
  HISTORY
  HORROR
  HUMOR

  """General literature."""
  LITERARY_FICTION

  """Nothing in the list fits."""
  OTHER
  POETRY
  ROMANCE
  SCIENCE
  SCIENCE_FICTION
  SELF_HELP
  THRILLER
  TRAVEL
}

"""One segment of the genre bar."""
type GenreCount {
  count: Int!

  """Null on the trailing "others" segment."""
  genre: Genre
}

"""
One audiobook of the Audible library, as it would be catalogued.

A proposal, not a record — the same contract `scanBook` has. Nothing is saved until `importAudibleBooks` is called with the ASINs the reader ticked. Every imported book is catalogued as an `AUDIOBOOK`.
"""
type ImportableBook {
  """
  True when a book with the same title and author is already catalogued — whether it was imported before or scanned from the printed edition. Leave these unticked: `importAudibleBooks` skips them anyway.
  """
  alreadyInLibrary: Boolean!

  """Pass this back to `importAudibleBooks` to catalogue the title."""
  asin: AudibleAsin!
  authors: [AuthorName!]!
  coverUrl: CoverUrl

  """
  Audible's running time, kept on the book: it is what the listening statistics count, the way pages are what the reading statistics count.
  """
  durationMinutes: Int

  """
  When the listening ended, kept on the imported book so a decade of listening does not land on today and rewrite the reading statistics.
  """
  finishedAt: DateTime

  """
  Who reads it. Shown in the picker to tell two recordings apart, and kept on the book: Audible is the only source that names them.
  """
  narrators: [NarratorName!]!

  """Null for a standalone title."""
  seriesName: SeriesName

  """
  Where Audible says the reader stands: finished is `READ`, started is `READING`, an untouched purchase lands on the pile.
  """
  status: ReadingStatus!
  title: BookTitle!

  """Null outside a numbered spine — Audible numbers side stories 4.5."""
  volume: VolumeNumber
}

"""
A 13-digit ISBN, hyphens and spaces removed, validated on its check digit.

The check digit is enforced rather than assumed: models invent ISBNs that look right, and a wrong one silently poisons every later lookup. Example: "9780756404741".
"""
scalar Isbn13

"""
One heading of the library list.

A section holds only books the reader owns: the catalogue never adds a row here. A saga gets its own section from the first volume owned, so a book never migrates between sections when an unrelated one is added.

A saga held in two languages makes two sections, one per language. They share a `seriesId` and differ by `language`, so a client keying rows on the saga alone must key on the pair instead.
"""
type LibrarySection {
  """Ordered along the spine, then related works; by title on the shelf."""
  books: [Book!]!

  """
  The language its volumes are in. Null on the standalone shelf, and null on a saga whose volumes carry no recorded language.
  """
  language: BookLanguage

  """Null on the trailing shelf, which gathers the standalone books."""
  series: SeriesName
  seriesId: SeriesId
}

"""
The signed-in user: their identity and onboarding state.

Always resolvable from the auth token, so `userId` is always present. Every other field is null until the onboarding wizard completes, which lets the app route a fresh account into onboarding.

```graphql
query {
  me {
    userId
    firstName
    onboardingCompleted
  }
}
```
"""
type Me {
  """The user's first name, set during onboarding; null before it is done."""
  firstName: PersonName

  """
  Whether this account may open the in-app admin screen (`adminMetrics`). Set by hand on the profile document, false for everyone else.
  """
  isAdmin: Boolean!

  """Convenience flag the app routes on: true once onboarding is done."""
  onboardingCompleted: Boolean!

  """When onboarding finished, or null if it never has."""
  onboardingCompletedAt: DateTime

  """The Firebase Auth user id, also the id of the profile document."""
  userId: UserId!
}

"""
Hours listened in one month of the current year, rounded to the hour. Each finished audiobook spreads its running time evenly over the days it was open, the way pages are spread; a book with no running time counts for nothing, which leaves printed books out on their own.
"""
type MonthHours {
  hours: Int!

  """1 for January, 12 for December."""
  month: Int!
}

"""
Pages read in one month of the current year. Each finished book spreads its page count evenly over the days it was open: progress itself is never tracked.
"""
type MonthPages {
  """1 for January, 12 for December."""
  month: Int!
  pages: Int!
}

type Mutation {
  """
  Catalogue a book without scanning it — typed by hand, or taken from a series catalogue. Consumes no scan credit.
  """
  addBook(input: NewBookInput!): Book!

  """
  Register the device with the authorization code the web view caught, and link the account.
  
  The credentials are sealed before they reach storage and never leave the server. Fails with `AUDIBLE_NO_PENDING_LOGIN` when no sign-in was started, `AUDIBLE_LOGIN_EXPIRED` past the thirty-minute window — start over in both cases — and `AUDIBLE_UNAVAILABLE` when Amazon refuses the registration.
  """
  completeAudibleLogin(
    """
    The `openid.oa2.authorization_code` query parameter of the landing URL.
    """
    authorizationCode: String!
  ): AudibleAccount!

  """
  Finish onboarding: save the profile and grant the welcome scans.
  
  Returns the updated `Me`, with `onboardingCompleted` now true. The welcome scans are granted only on the first call for an account: the mutation stays reachable afterwards so a reader can change the name they are addressed by, and re-granting there would make a one-off gift renewable.
  """
  completeOnboarding(
    """The first name to persist."""
    input: CompleteOnboardingInput!
  ): Me!

  """
  Permanently delete the signed-in account and all of its data.
  
  Irreversible. Erases the library, the cover images, the scan allowance and the stored entitlement, drops the profile, and deletes the Firebase Auth user. Does NOT cancel an active App Store subscription: Apple owns that lifecycle, so a subscriber must cancel separately in the App Store. The shared series catalogue is untouched — it belongs to no one and serves every other reader. Always returns `true`.
  """
  deleteAccount: Boolean!

  """
  Remove a book from the library for good. Returns true when it was there.
  """
  deleteBook(id: BookId!): Boolean!

  """
  Forget the Audible connection. Books already imported stay in the library.
  
  Only our copy of the credentials goes: the device stays registered on the Amazon side until the reader removes it from their account there. Returns false when there was nothing to disconnect.
  """
  disconnectAudible: Boolean!

  """
  Catalogue the Audible titles the reader ticked, and return the books created.
  
  The library is read again from Amazon rather than trusted from the app: the client sends identifiers, every stored field comes from the source. An ASIN the library does not hold matches nothing, and a title already catalogued is skipped — so calling this twice with the same list creates no duplicates.
  
  Consumes no scan credit: an import calls no model. Fails with `AUDIBLE_NOT_CONNECTED` and `AUDIBLE_UNAVAILABLE` like `audibleLibrary`.
  """
  importAudibleBooks(
    """The ASINs to catalogue, from `audibleLibrary`."""
    asins: [AudibleAsin!]!
  ): [Book!]!

  """
  Give a book one to five stars. Rating marks it as read: the reader is saying they finished it, and leaving it on the pile would make every filter lie.
  """
  rateBook(id: BookId!, rating: StarRating!): Book!

  """
  Rate a saga, one to five stars. Its own judgement, not the average of the volumes, and it leaves every volume rating alone.
  
  The saga is not checked to exist: a reader reaches it from a volume they own, and a saga the catalogue has never described is still theirs to rate.
  """
  rateSeries(rating: StarRating!, seriesId: SeriesId!): SeriesOpinion!

  """
  Take a rating back. The book stays read, with its reading dates: withdrawing a judgment is not saying the reading never happened.
  """
  removeBookRating(id: BookId!): Book!

  """Take a saga rating back. Leaves the heart alone."""
  removeSeriesRating(seriesId: SeriesId!): SeriesOpinion!

  """
  Read a book cover with AI and return a record for the reader to review.
  
  Nothing is saved: the answer is a proposal. The app shows it, the reader corrects what the model got wrong, and `addBook` persists the result. That review step is the safety net against a misread cover.
  
  Three model calls at most — the cover, a web-grounded enrichment, and a series catalogue only when the saga is not already known. Results are cached by SHA-256 and language, so scanning the same cover twice calls nothing.
  
  Spends one scan of the allowance (see the `quota` query): the month first, then the scans granted at onboarding. Only a real model call is charged — a cached cover is free, and so is a failure. Fails with `QUOTA_EXHAUSTED` once nothing is left, `IMAGE_TOO_LARGE` above the 10 MB limit, or `SCAN_FAILED` when the model call errors.
  """
  scanBook(
    """Cover photo as a base64-encoded JPEG (no data URL prefix), up to 10 MB"""
    imageBase64: String!
  ): ScanResult!

  """
  Turn the nightly Audible sync on or off.
  
  On, a nightly pass catalogues what the reader bought since the last one and moves imported books to the status Audible reports — a title finished there becomes `READ` here, one it says was never opened goes back to the pile. Off, nothing happens until the reader imports by hand again; books already catalogued stay exactly as they are.
  
  Fails with `AUDIBLE_NOT_CONNECTED` when no account is linked: there is no library to sync, so there is no setting to keep.
  """
  setAudibleAutoSync(enabled: Boolean!): AudibleAccount!

  """Keep a book close, or stop. Leaves the star rating alone."""
  setBookFavorite(favorite: Boolean!, id: BookId!): Book!

  """
  Mark a book as excluded from any shared view. Sharing is not built yet; the flag exists now so adding it later costs no migration.
  """
  setBookHidden(hidden: Boolean!, id: BookId!): Book!

  """Write or replace the reader note. Passing null deletes it."""
  setBookNote(id: BookId!, note: ReadingNote): Book!

  """
  Move a book along the pile. The reading dates follow from the move and are never typed: going back to TO_READ clears them.
  """
  setReadingStatus(id: BookId!, status: ReadingStatus!): Book!

  """Keep a saga close, or stop. Leaves the rating alone."""
  setSeriesFavorite(favorite: Boolean!, seriesId: SeriesId!): SeriesOpinion!

  """
  Open an Amazon sign-in for the given marketplace.
  
  The exchange is PKCE and its secret half stays on the server: the app gets the page to show, the cookies to plant first and the redirect to watch for. Hand the authorization code that redirect carries to `completeAudibleLogin` within thirty minutes.
  
  An existing connection is left working until the new sign-in completes, so a reader who changes their mind is not disconnected.
  """
  startAudibleLogin(
    """The Amazon store the reader buys audiobooks on."""
    marketplace: AudibleMarketplace!
  ): AudibleLogin!

  """
  Hand over a transaction the App Store signed: after a purchase, after a restore, and on every launch while a subscription is running.
  
  The signature is verified against Apple’s root certificates and the purchase must carry this account’s `appAccountToken`, so this is what grants Premium: nothing else does.
  
  Fails with `INVALID_TRANSACTION` when the signature does not check out, and `TRANSACTION_NOT_YOURS` when the purchase belongs to another account.
  
  ```graphql
  mutation {
    syncEntitlement(signedTransaction: "eyJhbGciOi...") {
      plan
      expiresOn
    }
  }
  ```
  """
  syncEntitlement(
    """
    The JWS representation of the StoreKit transaction, e.g. the `jwsRepresentation` of a verified entitlement
    """
    signedTransaction: String!
  ): Entitlement!

  """
  Correct a record the scan got wrong. Omitted fields are left alone; an optional field passed as null is cleared.
  """
  updateBook(id: BookId!, input: BookEditInput!): Book!
}

"""
Who reads an audiobook aloud, 1 to 200 characters. Not an AuthorName: a narrator is not the author of what they read. Example: "Bernard Gabay".
"""
scalar NarratorName

"""
A book catalogued without a scan — typed by hand, or taken from a series catalogue. Consumes no scan credit.
"""
input NewBookInput {
  authors: [AuthorName!]

  """
  The publisher cover `scanBook` found by ISBN. Pass it back unchanged; omitted for a book typed by hand.
  """
  coverUrl: CoverUrl
  firstPublishedIn: Year

  """Defaults to BOOK."""
  format: BookFormat
  genre: Genre

  """Defaults to false."""
  hidden: Boolean
  isbn13: Isbn13

  """The language of this edition, taken from a scan result."""
  language: BookLanguage

  """
  Who reads the recording, at most five. Only meaningful on an AUDIOBOOK.
  """
  narrators: [NarratorName!]
  pageCount: PageCount
  publisher: Publisher

  """
  The saga this book belongs to, taken from a scan result. Omitted for a book typed by hand.
  """
  series: SeriesMembershipInput

  """
  Defaults to TO_READ, the only status true of every freshly catalogued book.
  """
  status: ReadingStatus

  """At most three."""
  subgenres: [Subgenre!]
  synopsis: Synopsis
  title: BookTitle!
}

"""
Page count of this edition, 1 to 20000. Absent when unknown — never zero, which would read as a real count of nothing. Example: 662.
"""
scalar PageCount

"""A percentage from 0 to 100. Example: 42.5."""
scalar Percentage

"""
The reader's own first name, 1 to 200 characters, collected once during onboarding so the app can address them. Distinct from `AuthorName`, which names someone who wrote a book. Example: "Thibaut".
"""
scalar PersonName

"""
What an account is entitled to.

Everyone starts on `FREE`, and `PREMIUM` is only ever the result of a purchase the App Store signed: an expired, refunded or cancelled-and-elapsed subscription reads back as `FREE`.
"""
enum Plan {
  """
  The plan every account starts on. The app is fully usable; only the AI scan is metered against a monthly allowance.
  """
  FREE

  """
  A running subscription. Scanning is unlimited, within a fair-use ceiling.
  """
  PREMIUM
}

"""
The publisher of this edition, 1 to 200 characters. Example: "DAW Books".
"""
scalar Publisher

type Query {
  """
  The reader's Audible connection, or null when there is none.
  
  A sign-in left half-finished reads as null: the settings screen must offer to connect, not claim an account no credentials back.
  """
  audibleAccount: AudibleAccount

  """
  The whole Audible library, as books the reader could catalogue.
  
  Nothing is saved and no AI runs, so this costs no scan credit. Every title is returned, including those already catalogued — they come back with `alreadyInLibrary` set so the picker can leave them unticked rather than hide them.
  
  Fails with `AUDIBLE_NOT_CONNECTED` when no account is linked, and `AUDIBLE_UNAVAILABLE` when Amazon refuses the call — a revoked device or a changed password lands here, and the fix is to connect again.
  """
  audibleLibrary: [ImportableBook!]!

  """One book of the reader library. Null when they do not own it."""
  book(id: BookId!): Book

  """
  Application release notes, one entry per version, most recent first.
  
  Served from the published changelog asset in the caller's language (from `Accept-Language`, English fallback). Global (not user-scoped); the app uses it to show what changed in each release.
  """
  changelog: [ChangelogEntry!]!

  """
  The home dashboard of the signed-in reader.
  
  Pass the device time zone: every day, month and year is counted in it.
  
  ```graphql
  query {
    dashboard(timeZone: "Europe/Paris") {
      booksPerYear { year count }
      reading { id title coverUrl startedAt }
      pagesPerDay { current previous }
    }
  }
  ```
  """
  dashboard(timeZone: TimeZone!): Dashboard!

  """
  What the account is entitled to today, and the account token to start a purchase with. The app reads this before showing the subscription sheet.
  
  ```graphql
  query {
    entitlement {
      plan
      appAccountToken
      productId
      expiresOn
    }
  }
  ```
  """
  entitlement: Entitlement!

  """
  The reader whole library, grouped into series sections.
  
  Filtering by status happens before grouping, so a filter empties a saga section rather than leaving an empty heading behind. Sections are sorted by series name, and the standalone shelf trails them.
  """
  library(
    """Keep only books in this status. Omit for the whole library."""
    status: ReadingStatus
  ): [LibrarySection!]!

  """
  The signed-in user, resolved from the auth token.
  
  Always returns a `Me`, even before onboarding: a fresh account comes back with only `userId` set, which the app uses to route into the onboarding wizard.
  """
  me: Me!

  """
  Every saga the reader owns a volume of, alphabetically.
  
  Taken from the books, then matched against the catalogue in one getAll rather than a lookup per saga. A saga nobody has catalogued still answers here, with a null catalogue and a null state.
  
  One row per saga and language: a reader who holds Dune in French and in English follows two rows, because those are two sets of books.
  """
  mySeries: [FollowedSeries!]!

  """
  This month’s scan allowance for the signed-in account. The scan screen reads it to show what is left, and the paywall to explain what a subscription lifts.
  
  ```graphql
  query {
    quota {
      plan
      used
      limit
      remaining
      welcomeRemaining
      totalRemaining
      renewsOn
    }
  }
  ```
  """
  quota: Quota!

  """
  The full catalogue of one saga, owned volumes and unowned alike.
  
  Everything the reader does not own is a proposal: nothing enters a library until they add it. Null when the saga has never been catalogued.
  """
  series(id: SeriesId!): Series

  """
  What the reader makes of one saga. Null until they say something about it — an opinion with neither a rating nor a heart is not stored.
  
  A root query rather than a field on `Series`: the catalogue holds no reference to any reader, and it must stay that way.
  """
  seriesOpinion(seriesId: SeriesId!): SeriesOpinion
}

"""
The scan allowance: what the month holds, what was granted on top, what has been spent and when the month renews.

Only the AI scan is metered. Adding a bottle by hand, the cellar, tastings and sharing are unlimited on every plan, so a spent allowance never stops the app being used.
"""
type Quota {
  """How many the plan allows in a month, e.g. `5`"""
  limit: Int!

  """The plan the allowance is read for, e.g. `FREE`"""
  plan: Plan!

  """
  How many are left of the month, e.g. `3`. Never negative: an allowance already overspent reads as `0`. Ignores the granted scans — read `totalRemaining` for what can really be scanned.
  """
  remaining: Int!

  """
  When the counter goes back to zero: midnight UTC on the 1st of the next month, e.g. `"2026-08-01T00:00:00.000Z"`
  """
  renewsOn: DateTime!

  """
  Everything the account can still scan: the month plus what it was granted, e.g. `17`. This is the number a screen should show — the one the scan gate refuses at `0`.
  """
  totalRemaining: Int!

  """How many scans were spent this month, e.g. `2`"""
  used: Int!

  """
  How many granted scans are left, e.g. `14`. Handed once when onboarding completes, drawn down only after the month is spent, and never refilled by the calendar.
  """
  welcomeRemaining: Int!
}

"""
The reader own note on a book, 1 to 10000 characters. Clearing it deletes it rather than storing an empty string.
"""
scalar ReadingNote

"""
Where a book stands for its reader.

`TO_READ` is where every book lands when catalogued, `READING` is where it spends most of its life, `READ` is the end. Moving between them stamps the reading dates: those follow from the move and are never typed by the reader.
"""
enum ReadingStatus {
  """
  Finished. Stamps `finishedAt`, and `startedAt` too if it was never set.
  """
  READ

  """Started. Stamps `startedAt` the first time, and clears `finishedAt`."""
  READING

  """On the pile. Clears any reading date it had."""
  TO_READ
}

"""
What the model read on a cover, after enrichment. Nothing is saved yet: the reader reviews this and decides.

Check `recognized` first. False means no book was identified — a photo of something that is not a cover — and every other field is empty. It is an ordinary outcome, not an error, and it costs no scan.

Optional fields are absent rather than guessed. A field the model was unsure of is dropped on the way through: an invented ISBN or a page count of zero is worse than nothing, because it would be trusted later.
"""
type ScanResult {
  authors: [AuthorName!]!

  """
  The publisher cover, found by ISBN and checked to exist. Null without an ISBN or when none was found. Hand it back to `addBook` unchanged.
  """
  coverUrl: CoverUrl

  """Year the work first appeared, not the year of this edition."""
  firstPublishedIn: Year

  """Null when the cover did not say. The app then proposes BOOK."""
  format: BookFormat

  """Null when the model could not classify the book."""
  genre: Genre
  isbn13: Isbn13

  """
  The language of the photographed edition, read off the cover — the object on the shelf, not the language the work was written in. Null when the cover does not settle it. Hand it back to `addBook` unchanged.
  """
  language: BookLanguage
  pageCount: PageCount
  publisher: Publisher
  recognized: Boolean!
  series: ScannedSeries
  subgenres: [Subgenre!]!
  synopsis: Synopsis

  """Null when nothing was recognized."""
  title: BookTitle
}

"""
The saga the scanned book belongs to, as the enrichment step resolved it.

Absent for a standalone book, which is most of them. Found by the web search rather than read off the cover: a great many novels belong to a cycle the cover never mentions.
"""
type ScannedSeries {
  """
  Hand this back to `addBook` unchanged so the book joins the very catalogue this scan built.
  """
  id: SeriesId!
  kind: VolumeKind!
  name: SeriesName!
  volume: VolumeNumber
}

"""
The shared catalogue of a saga.

A public fact with no reference to any reader: one document serves everyone, which is what lets a single AI call pay for the whole saga. It is never exposed through library sharing, which shows books only.

Volumes are stored in publication order, which is verifiable. Reading order differs on many sagas and is an opinion.
"""
type Series {
  author: AuthorName!
  catalogedAt: DateTime!
  description: SeriesDescription
  id: SeriesId!
  name: SeriesName!

  """
  Prequels, spin-offs, novellas and companions — everything off the spine.
  """
  relatedWorks: [Volume!]!

  """The numbered main volumes only, ascending."""
  spine: [Volume!]!

  """
  Every volume, in catalogue order: the numbered spine, then related works.
  """
  volumes: [Volume!]!
}

"""
A short description of the saga, 1 to 2000 characters, in the caller language.
"""
scalar SeriesDescription

"""
Identifier of a series in the shared catalogue, derived from its name and author rather than random.

Deterministic on purpose: two readers scanning volumes of the same saga must reach the same catalogue document, so it is paid for once. Diacritics are folded and a leading article dropped. Example: "wheel-of-time--robert-jordan".
"""
scalar SeriesId

"""
A book place in a saga, carried on the book itself.

The series name is denormalized here on purpose: grouping a 300-book library into sections must not read one catalogue document per row.
"""
type SeriesMembership {
  id: SeriesId!
  kind: VolumeKind!
  name: SeriesName!

  """Null for a spin-off or companion, which sit outside the numbering."""
  volume: VolumeNumber
}

"""
A book place in a saga, as `scanBook` resolved it. Pass it back unchanged.
"""
input SeriesMembershipInput {
  id: SeriesId!
  kind: VolumeKind!
  name: SeriesName!
  volume: VolumeNumber
}

"""
The name of a series, 1 to 200 characters. Example: "The Wheel of Time".
"""
scalar SeriesName

"""
What one reader makes of one saga — never part of the saga's shared catalogue, which is a fact about the world with no reader in it.

Held per saga, never per saga and language: the split the library draws by language is about editions on a shelf, and an opinion is about the work.
"""
type SeriesOpinion {
  """A saga the reader keeps close. Independent of the rating."""
  favorite: Boolean!

  """
  The reader's judgement of the saga itself, and deliberately not the average of their volume ratings: a cycle can be worth more than its books, or rather less. Null until they rate it.
  """
  rating: StarRating
  seriesId: SeriesId!
}

"""
How far the reader is through a saga in progress, on the numbered volumes already published.
"""
type SeriesProgress {
  id: SeriesId!
  name: SeriesName!
  readCount: Int!
  totalCount: Int!
}

"""
Whether the reader is still working through a saga.

Derived per request from what they own, never stored. `COMPLETE` means every published volume has been read; an announced but unpublished volume does not hold a saga open, because a reader who is up to date has finished it.
"""
enum SeriesState {
  """Every published volume has been read."""
  COMPLETE

  """Published volumes remain unread."""
  IN_PROGRESS
}

"""
A reader rating, 1 to 5 whole stars.

Whole stars only: half stars double the value space without adding discernment. Setting a rating also marks the book as read. Example: 4.
"""
scalar StarRating

"""
One free label refining the genre, 1 to 100 characters, in the caller language. Example: "Dark fantasy".
"""
scalar Subgenre

"""The book summary, 1 to 4000 characters, in the caller language."""
scalar Synopsis

"""
An IANA time zone identifier known to the server, such as "Europe/Paris". Reading statistics count days, months and years in it.
"""
scalar TimeZone

"""A figure for this year to date, beside the same span of last year."""
type Trend {
  """Null when this year has nothing to measure yet."""
  current: Int

  """Null when last year has nothing to compare against: draw no arrow."""
  previous: Int
}

"""
A Firebase Auth user identifier, carried as an opaque non-empty string.

Every book is owned by a `UserId`; the viewer identity is derived from the request Bearer token, so this is rarely passed as an input. Example: "KyTjMU39NBhfakGxExfqLmC5OYU2".
"""
scalar UserId

"""
One entry of a saga catalogue, owned or not.

The catalogue lists what exists in the world, so most volumes here are books the reader does not own: those are proposals, and nothing enters a library until the reader adds it.
"""
type Volume {
  kind: VolumeKind!

  """Position along the spine. Null for anything that is not a main volume."""
  number: VolumeNumber

  """
  Publication year. A year in the future marks a volume that has been announced but has not shipped.
  """
  publishedIn: Year
  title: BookTitle!
}

"""
Where a volume sits in a saga.

Only `MAIN` belongs to the numbered spine; everything else orbits it and usually carries no number, which is why `volume` is nullable. The series screen renders the spine first and the rest under "Related works".
"""
enum VolumeKind {
  """A guide, atlas, or artbook rather than a story."""
  COMPANION

  """A numbered volume of the main story."""
  MAIN

  """A short work tied to the saga."""
  NOVELLA

  """Set before the main story, often published later."""
  PREQUEL

  """A side story in the same world, outside the numbering."""
  SPIN_OFF
}

"""
Position of a volume along the spine of its series, 1 to 200.

Absent on anything that is not a numbered main volume: a spin-off or a companion has no place in the numbering. Example: 3.
"""
scalar VolumeNumber

"""
A four-digit publication year, from 1450 to ten years out.

The upper bound leaves room for an announced but unpublished volume, which the series catalogue keeps on purpose. Example: 2007.
"""
scalar Year

"""Books finished in one calendar year."""
type YearCount {
  count: Int!
  year: Int!
}