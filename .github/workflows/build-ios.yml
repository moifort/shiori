name: Build

# Runs only for what the app is built from: its sources, the committed schema the
# Apollo code is regenerated from (so a backend change that breaks an iOS operation
# still lands here), the two checks the job ends with, and this file. A server-only
# push no longer pays twenty minutes of macOS runner, nor cancels a running build.
# No branch protection requires this check, so a run that never starts blocks nothing.
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'shared/schema.graphql'
      - 'scripts/check-strings.ts'
      - 'scripts/check-ios-components.ts'
      - 'scripts/stable-mtimes.py'
      - '.github/workflows/build-ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - 'shared/schema.graphql'
      - 'scripts/check-strings.ts'
      - 'scripts/check-ios-components.ts'
      - 'scripts/stable-mtimes.py'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

# A newer push to the same branch, or to the same pull request, makes this run
# pointless: it is cancelled rather than left to use a runner for nothing. Keyed on
# the workflow file and the ref, since the three test workflows share one name.
concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Guards the one thing the other three workflows cannot see: whether the app
  # still compiles. The generated Apollo code is regenerated here from the
  # committed schema, so a backend change that the iOS operations no longer match
  # fails here rather than at release time. Builds without signing or uploading.
  # macos-26 is a standard runner, so this costs nothing on a public repository.
  ios:
    name: 📱 iOS
    runs-on: macos-26
    # A run is eight to ten minutes: restoring the packages, a cold build, one
    # simulator booted while they go, and tests that take seconds once the app is
    # up. Thirty leaves room for a slow cache, not for a second simulator boot.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, commits and trees only, for the step that stamps each
          # source with the time of its last change; the blobs come down for the
          # checkout alone, as they would with a shallow clone.
          fetch-depth: 0
          filter: blob:none

      - name: Select the latest final Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Booted first, so its ten-minute first start runs alongside the Apollo
      # generation and the build rather than after them, where it sat as eleven
      # silent minutes before the tests on 2026-10-16.
      #
      # The image ships one iPhone 17 per iOS runtime (26.2, 26.4 and 26.5 on
      # 2026-10-25); the newest is taken, as on every project. The scheme's test
      # pre-action keeps whatever simulator is already booted, so this one is the
      # only one that ever boots: picking the first match while the pre-action
      # booted "iPhone 17" by name cold-started a second simulator inside the test
      # step, six to seven silent minutes before tests that run in three seconds.
      - name: Boot the simulator the tests run on
        run: |
          set -euo pipefail
          picked=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | test("SimRuntime\\.iOS-")) | .key as $rt | .value[]
                  | select(.isAvailable and (.name | startswith("iPhone")))
                  | {name, udid, exact: (.name == "iPhone 17"),
                     rt: ($rt | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber))})
            | sort_by([.exact, .rt]) | last
            | "\(.udid)\t\(.name) on iOS \(.rt | join("."))"')
          udid=${picked%%$'\t'*}
          echo "Testing on ${picked#*$'\t'} ($udid)"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"

      # Compiling the twenty assets took 66 to 98 seconds on the runner against
      # three on a Mac: actool's first start pays for the services behind it. It
      # runs once here, in the background, while the packages download, so the
      # build finds them warm; the build step prints how long it took.
      - name: Warm up the asset catalog compiler
        run: |
          set -euo pipefail
          target=$(grep -m1 -oE 'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+' \
            ios/Shiori.xcodeproj/project.pbxproj | grep -oE '[0-9.]+$')
          mkdir -p "$RUNNER_TEMP/actool-warmup"
          nohup bash -c "start=\$SECONDS
            xcrun actool ios/Shiori/Assets.xcassets --compile '$RUNNER_TEMP/actool-warmup' \
              --platform iphonesimulator --minimum-deployment-target '$target' \
              --target-device iphone --output-format human-readable-text >/dev/null 2>&1 || true
            echo \"actool warm-up: \$((SECONDS - start)) s\" > '$RUNNER_TEMP/actool-warmup.log'" \
            >/dev/null 2>&1 &

      - name: Materialize gitignored build files
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}" \
            | openssl base64 -d -A > ios/Shiori/GoogleService-Info.plist
          cp ios/Shiori/Shared/Secrets.swift.example ios/Shiori/Shared/Secrets.swift
          mkdir -p ios/ShioriUITests/Support
          cp ios/Shiori/Shared/Secrets.swift.example ios/ShioriUITests/Support/TestSecrets.swift

      # Fetching the packages took four of the Apollo step's minutes on 2026-10-20.
      # Package.resolved is not committed, so the cache cannot be keyed on it before
      # resolving: the latest cache is restored, resolution then fetches only what
      # moved, and a new cache is saved only when the resolved versions changed.
      - name: Restore the Swift packages
        id: spm-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-${{ github.sha }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate Apollo GraphQL code (gitignored, regenerated per build)
        run: |
          set -euo pipefail
          # Resolve SPM so the apollo-ios checkout (and its bundled CLI) exists.
          xcodebuild -resolvePackageDependencies \
            -project ios/Shiori.xcodeproj -scheme Shiori \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
          resolved=ios/Shiori.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if [ -f "$resolved" ]; then
            echo "SPM_CACHE_KEY=spm-${RUNNER_OS}-$(shasum -a 256 "$resolved" | cut -c1-16)" \
              >> "$GITHUB_ENV"
          fi
          # What the cache carries, so a heavier restore can be traced to its part.
          du -sh "$RUNNER_TEMP/SourcePackages"/* 2>/dev/null || true
          # Apollo 2.x ships the CLI as a tarball inside the checkout — extract it.
          CLI_DIR="$RUNNER_TEMP/SourcePackages/checkouts/apollo-ios/CLI"
          tar -xzf "$CLI_DIR/apollo-ios-cli.tar.gz" -C "$CLI_DIR"
          chmod +x "$CLI_DIR/apollo-ios-cli"
          (cd ios && "$CLI_DIR/apollo-ios-cli" generate)

      - name: Save the Swift packages
        if: env.SPM_CACHE_KEY != '' && steps.spm-restore.outputs.cache-matched-key != env.SPM_CACHE_KEY
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: ${{ env.SPM_CACHE_KEY }}

      # Xcode recompiles what is newer than its last build, and a checkout stamps
      # every file with the moment it was written: on a fresh runner the restored
      # DerivedData would be worth nothing. Each tracked file takes the time of the
      # commit that last touched it, each generated or materialized file a time
      # derived from its content, so two runs on the same sources agree on every
      # time and the build below recompiles only what changed since the cached one.
      - name: Stamp the sources with times that survive a checkout
        run: |
          set -euo pipefail
          python3 scripts/stable-mtimes.py \
            ios/Shiori/Generated/GraphQL \
            ios/Shiori/GoogleService-Info.plist \
            ios/Shiori/Shared/Secrets.swift \
            ios/ShioriUITests/Support/TestSecrets.swift
          xcode=$(basename "$MD_APPLE_SDK_ROOT" .app)
          echo "DD_RESTORE_KEY=dd-${xcode}-${SPM_CACHE_KEY}-" >> "$GITHUB_ENV"
          echo "DD_CACHE_KEY=dd-${xcode}-${SPM_CACHE_KEY}-${GITHUB_SHA}" >> "$GITHUB_ENV"

      # The latest build on this Xcode and these package versions; a dependency
      # bump or an Xcode update starts cold. Logs stay out: the test results go
      # there, and nothing reads them back.
      - name: Restore the compiled DerivedData
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/DerivedData
            !${{ runner.temp }}/DerivedData/Logs
          key: ${{ env.DD_CACHE_KEY }}
          restore-keys: ${{ env.DD_RESTORE_KEY }}

      - name: Build the app and its tests
        # Compiled once, for the simulator the tests then run on: no signing
        # identity needed (release-ios.yml owns those). The index store feeds
        # Xcode's editor, which nobody opens here, so it is not written. The
        # packages were resolved two steps up, so this step does not do it again,
        # and only what the unit tests need is built: the UI test runner is not.
        # The timing summary says where a slow build spent its minutes.
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/actool-warmup.log" 2>/dev/null || echo "actool warm-up still running"
          xcodebuild -project ios/Shiori.xcodeproj -scheme Shiori \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            -only-testing:ShioriTests \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build-for-testing
          du -sh "$RUNNER_TEMP/DerivedData"/* 2>/dev/null || true

      # Saved from every push to main, before the tests so a failing test keeps
      # the build warm; a pull request restores main's and saves nothing.
      - name: Save the compiled DerivedData
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/DerivedData
            !${{ runner.temp }}/DerivedData/Logs
          key: ${{ env.DD_CACHE_KEY }}

      - name: Unit tests
        # The ViewModels driven over inline clients (ShioriTests): no network, no
        # Firebase, only a simulator to host the bundle. Runs what the step above
        # built, without compiling anything again.
        run: |
          set -euo pipefail
          # Says how long the boot still had to go, so a slow one shows here.
          start=$SECONDS
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          echo "Simulator ready after a further $((SECONDS - start)) s"
          # SHIORI_TEST_PHOTO=NO reaches the scheme's test pre-action as a build
          # setting: the UI tests' photo is not imported for a run of the unit tests.
          # The pre-action times itself into a log, printed below, since xcodebuild
          # shows nothing of it and the minutes before the first test were silent.
          xcodebuild -project ios/Shiori.xcodeproj -scheme Shiori \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            -only-testing:ShioriTests \
            CODE_SIGNING_ALLOWED=NO \
            SHIORI_TEST_PHOTO=NO \
            test-without-building
          cat /tmp/shiori-test-preaction.log 2>/dev/null || echo "The pre-action left no log"

      - uses: oven-sh/setup-bun@v2

      - name: Every string has its French and its English
        # Reads the strings the build just extracted: one added to the code and
        # left out of the catalogue fails here, as does one with no English.
        run: bun scripts/check-strings.ts "$RUNNER_TEMP/DerivedData"

      - name: Components stay pure and previewed
        # docs/ios-guide.md: nothing under components/, Shared/Components or
        # Shared/Book calls the server, reads a singleton or holds a ViewModel,
        # and every view there has a #Preview.
        run: bun scripts/check-ios-components.ts
