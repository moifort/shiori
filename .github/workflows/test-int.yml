name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - 'screenshots/**'
      - 'README.md'
      - 'CLAUDE.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - 'screenshots/**'
      - 'README.md'
      - 'CLAUDE.md'

# A newer push to the same branch, or to the same pull request, makes this run
# pointless: it is cancelled rather than left to use a runner for nothing. Keyed on
# the workflow file and the ref, since the three test workflows share one name.
concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  int:
    name: 🔗 Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx nitro prepare
      - run: bun test .int.test
