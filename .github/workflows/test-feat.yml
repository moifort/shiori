name: Tests

on:
  # On main these tests run inside Deploy, which waits for them.
  workflow_call:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - 'screenshots/**'
      - 'README.md'
      - 'CLAUDE.md'

# A newer push to the same branch, or to the same pull request, makes this run
# pointless: it is cancelled rather than left to use a runner for nothing. Named by
# hand: called from Deploy, github.workflow_ref is Deploy's, the same for all three,
# and they would cancel one another.
concurrency:
  group: tests-feat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  feat:
    name: 🎯 Feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx nitro prepare
      - run: bun test .feat.test
