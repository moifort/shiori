name: Release Android

# One tag ships both apps: `v<version>` starts this workflow and release-ios.yml with the same
# version. `android-v<version>` ships Android alone, to rerun a release that failed here only.
on:
  push:
    tags: ['v*', 'android-v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown on Google Play, e.g. 1.2 (the same as the iOS release)'
        required: true
      track:
        description: 'Play track the bundle goes to'
        required: false
        default: 'internal'
        type: choice
        options: [internal, alpha, beta, production]

permissions:
  contents: read

concurrency:
  group: android-upload
  cancel-in-progress: false

jobs:
  release:
    name: 🤖 Build and upload to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Take the version from the tag, or from the manual run
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
          INPUT_TRACK: ${{ github.event.inputs.track }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#android-v}"
            NAME="${NAME#v}"
            TRACK="internal"
          else
            NAME="$INPUT_VERSION"
            TRACK="${INPUT_TRACK:-internal}"
          fi
          # Play refuses a version code it has seen: the run number only grows.
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"

      # The same notes as the App Store: the first section of each changelog, which a tag
      # must name. Play caps "What's new" at 500 characters per language.
      - name: Write the release notes from the changelogs
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/whatsnew"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            HEADING="$(grep -m1 '^## ' CHANGELOG.md)"
            case "$HEADING" in
              "## $NAME "*|"## $NAME") ;;
              *) echo "::error::CHANGELOG.md starts with '$HEADING', not version $NAME"; exit 1 ;;
            esac
          fi
          notes() {
            awk '/^## /{n++; if (n==2) exit} n==1 && /^- /{print "• " substr($0, 3)}' "$1" \
              | head -c 500
          }
          notes CHANGELOG.md > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          notes CHANGELOG.fr.md > "$RUNNER_TEMP/whatsnew/whatsnew-fr-FR"
          cat "$RUNNER_TEMP"/whatsnew/*

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: oven-sh/setup-bun@v2

      - name: Components stay pure and previewed
        run: bun scripts/check-android-components.ts

      - uses: gradle/actions/setup-gradle@v4

      - name: Write the Firebase config and the upload key
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          printf '%s' "$UPLOAD_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "SHIORI_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Lint
        working-directory: android
        run: ./gradlew :app:lintDebug

      - name: Test
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Build the signed bundle
        working-directory: android
        env:
          SHIORI_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          SHIORI_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          SHIORI_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          SHIORI_GOOGLE_WEB_CLIENT_ID: ${{ secrets.ANDROID_GOOGLE_WEB_CLIENT_ID }}
          SHIORI_SENTRY_DSN: ${{ secrets.ANDROID_SENTRY_DSN }}
        run: >-
          ./gradlew :app:bundleRelease
          -Pshiori.versionName=${{ steps.version.outputs.name }}
          -Pshiori.versionCode=${{ steps.version.outputs.code }}

      # Until the app's first release has been rolled out by hand in Play Console, Play only
      # accepts drafts. Set the repository variable PLAY_RELEASE_STATUS to `completed` after
      # that first rollout; production always stays a draft, promoted by hand.
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.polyforms.shiori.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          track: ${{ steps.version.outputs.track }}
          status: ${{ steps.version.outputs.track == 'production' && 'draft' || vars.PLAY_RELEASE_STATUS || 'draft' }}
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
