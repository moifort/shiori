name: Build Android

on:
  push:
    branches: [main]
    paths: ['android/**', 'shared/schema.graphql', 'ios/Shiori/**/*.graphql', '.github/workflows/build-android.yml']
  pull_request:
    paths: ['android/**', 'shared/schema.graphql', 'ios/Shiori/**/*.graphql', '.github/workflows/build-android.yml']

permissions:
  contents: read

jobs:
  build:
    name: 🤖 Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
      - name: Debug build
        working-directory: android
        run: ./gradlew :app:assembleDebug
